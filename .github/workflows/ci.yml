name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; newer pushes cancel older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint + types + contract (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # nested cutlass submodule is not needed for CPU checks

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling + package (CPU wheels, no GPU backends)
        run: |
          python -m pip install --upgrade pip
          # CPU torch first, from the CPU index, so the CUDA wheels are never resolved.
          # The type gate is only as strong as the stubs it can see: with torch and triton
          # absent, every `import torch` is an unresolved import and every torch attribute is
          # Unknown, so ty reports a wall of noise and none of the real findings. Nothing in
          # this job runs a kernel, so the CPU wheel is enough.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          # `[dev]` = pytest + ruff + ty; the core deps (triton, einops, jaxtyping, numpy) come
          # with the package. The optional backends (cute/baselines/bench) stay out -- the code
          # that needs them imports them lazily and the checker suppresses those imports by name.
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests benchmarks

      - name: Types (ty)
        # `ty`, not pyright. pyright cannot parse this codebase: jaxtyping shape strings
        # (`Float[torch.Tensor, "N S 3"]`) are read as forward-reference type expressions and
        # every one is a parse error -- 144 of them, all in src/, zero of them real, and not
        # suppressible because a parse error answers to no rule. So the step reported failure
        # for a codebase with no type findings at all, which is the same as no step.
        #
        # ty found 130 real ones instead. Among them: `kernels.cuda_transition` imported a symbol
        # that has never existed (so `Transition(implementation="cuda")` could not run at all),
        # `autotune/cache.py`'s ptxas probe imported a function triton had moved (so every cache
        # entry recorded `ptxas=?`), `build.py` called an attribute `bidirectional` does not have,
        # and `capture.py` installed a pre_hook timer on the class when triton sets that attribute
        # per instance (the metric had always printed zero).
        #
        # benchmarks/ is checked too. `[tool.ty.src].include` had always listed it while the
        # command said `src tests`, so 53 findings in the bench harness were invisible --
        # including a `BenchResult(status=..., error=...)` that raised TypeError on the very
        # path it was written to guard, and `fabric: Fabric` on eight bench entry points
        # that are only ever handed a no-op shim.
        #
        # The count is zero and this step GATES. No `|| true`: a finding must be fixed or
        # suppressed at its line with a reason, never hidden behind a green step.
        run: ty check src tests benchmarks

      - name: Tests (whole suite -- every test here is CPU-only)
        # Runs ALL of tests/, not a hand-listed subset. It used to name three files, so
        # 13 of 16 files -- 144 of 156 tests -- ran nowhere automatic, and the bugs they
        # cover shipped: `build all` defaulting to a config set that has never existed,
        # `audit` dead on two removed imports, the per-op sweep never merging its shards.
        # Measured: the whole suite is 76 s with CUDA_VISIBLE_DEVICES="" and needs no GPU.
        # Keep it that way -- a test that needs a device belongs behind the gpu marker.
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: pytest -q tests/ -m "not gpu"

      - name: Build-system audit (the 88-op checks that ran nowhere automatic)
        # `dev audit` inspects the LIVE autotuners -- is each grid brute-forced, does each prune
        # callback execute, does each op key on something the sweep moves -- 264 findings that no
        # test covers and that fail silently, months later, as an empty cache bucket.
        #
        # It could not gate until now: with no `--shards` and no CUDA it FAILED 139 times on its
        # own missing arguments and exited 1 every single run. Those two checks now say what they
        # need instead, so the remaining ones are real and this step is worth having.
        #
        # Reachability and cache coverage stay unanswered here by design -- both need a card or a
        # real build's shards, and neither exists on this runner. They report as WARN, not FAIL.
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: miniworld-engine dev audit

      - name: Numerical suite is wired up (collect-only, no device here)
        # tests/numerics/test_numerical.py is the GPU suite: one case per registry kernel that declares a
        # checker, comparing it against a torch reference. CI has no GPU, so it cannot run them --
        # but it CAN prove the suite still collects, which is what would have caught the previous
        # state: `pixi run test-gpu` pointed at tests/numerics/test_numerical.py and the file did not exist,
        # so "the numerical suite" was a name in a comment for as long as anyone cared to read it.
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: pytest -q tests/numerics/test_numerical.py --collect-only -m gpu | tail -1

  wheel:
    name: the artifact a consumer installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist/

      - name: It carries the assets the RUNTIME needs, and nothing it does not
        # An editable install reads straight from src/, so every check that passes here passes
        # locally whatever `package-data` says. The failure this catches is a wheel that contains
        # only .py: the shipped autotune caches, the default config set, the CUDA sources and the
        # PEP 561 marker are declared by glob, and a glob is one edit away from dropping them.
        # Counts are derived from the tree, not written down, so adding a kernel does not make
        # this fail for the wrong reason.
        run: |
          python - <<'EOF'
          import glob, pathlib, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          def n(sub): return sum(sub in x for x in names)
          src = pathlib.Path("src/miniworld_engine")
          want = {
              "py.typed":              (n("py.typed"), 1),
              "autotune/data/*.json":  (n("autotune/data"), len(list((src/"autotune/data").rglob("*.json")))),
              "configs/grid/*.csv":    (n("autotune/configs/grid"), len(list((src/"autotune/configs/grid").glob("*.csv")))),
              "manifests/*.csv":       (n("autotune/manifests"), len(list((src/"autotune/manifests").glob("*.csv")))),
              "registry.csv":          (n("kernels/registry.csv"), 1),
              "*.cu":                  (sum(x.endswith(".cu") for x in names), len(list(src.rglob("*.cu")))),
          }
          bad = {k: v for k, v in want.items() if v[0] != v[1]}
          for k, (got, exp) in want.items():
              print(f"  {k:24} {got:4} / {exp}")
          # What must NOT ship: the lab notebook, and the A/B config sets a consumer never selects.
          for label, sub in (("notes/", "/notes/"), ("A-B config sets", "autotune/configs/accuracy")):
              if n(sub):
                  bad[label] = (n(sub), 0)
          assert not bad, f"wheel contents wrong: {bad}"
          print(f"  OK: {len(names)} files")
          EOF

      - name: It imports with src/ off the path
        # The other half. `pip install --target` into an empty directory and import from there, so
        # a module that only resolves because the source tree is next to it fails here.
        run: |
          python -m pip install --quiet --no-deps --target /tmp/site dist/*.whl
          cd /tmp && PYTHONPATH=/tmp/site python -c "
          import miniworld_engine as m, miniworld_engine.kernels, miniworld_engine.ops
          from miniworld_engine.autotune import cache, configs, devices
          assert configs.default_config_dir().is_dir(), 'no packaged config set'
          assert devices._DEVICES.is_dir(), 'no packaged device manifests'
          print('imported', m.__version__, 'from', m.__file__)
          "

  floor:
    name: declared Python floor (3.10, CPU suite only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # `requires-python = ">=3.10"` is a promise, and until this job existed nothing kept it.
      # The repo runs 3.12 everywhere -- pixi env, the `checks` job above -- so the floor had
      # never been executed. It is not a theoretical concern: `modules/dispatch.py` carries an
      # explicit 3.10 branch (`enum.StrEnum` is 3.11+, so the else defines `class _StrEnum(str,
      # Enum)`) whose own comment reads "exercised only on 3.10". This job is what exercises it.
      #
      # Lint and types are NOT repeated here: ruff's target-version and ty's inferred
      # python-version both already come from `requires-python`, so the static half of the floor
      # is checked by the job above. What is missing is the runtime half -- does it import, and
      # does the suite pass -- which is all this job does.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install (CPU wheels, no GPU backends)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: The package imports at the floor
        # Separate from the suite so a failure here is unambiguous: an import error at 3.10 is a
        # broken version guard, not a broken test.
        run: python -c "import miniworld_engine, miniworld_engine.modules, miniworld_engine.cli; print('import ok')"

      - name: The 3.10 branch is the one that ran
        # Proves this job is testing what it claims: on 3.10 `KernelBackend` must come from the
        # fallback, not from enum.StrEnum. A job that silently ran 3.12 would pass everything
        # above and prove nothing.
        run: |
          python - <<'PY'
          import enum
          import sys

          from miniworld_engine.modules.dispatch import KernelBackend

          assert sys.version_info[:2] == (3, 10), f"this job must run 3.10, got {sys.version_info}"
          assert not hasattr(enum, "StrEnum"), "3.10 should not have enum.StrEnum"
          bases = [c.__name__ for c in KernelBackend.__mro__]
          assert "_StrEnum" in bases, bases          # the fallback class, not enum.StrEnum
          assert issubclass(KernelBackend, str), bases
          # and it has to behave: the whole point of StrEnum is that a member IS its value
          assert KernelBackend.TRITON == "triton", list(KernelBackend)
          print("3.10 fallback exercised:", bases)
          PY

      - name: Tests (CPU suite)
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: pytest -q tests/ -m "not gpu"
