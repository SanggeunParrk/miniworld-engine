name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; newer pushes cancel older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint + types + contract (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # nested cutlass submodule is not needed for CPU checks

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling + package (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright pytest
          # MPNN reference checks need CPU PyTorch and NumPy, but no Triton/CUDA or
          # optional comparison baselines. Keep the project itself no-deps so the
          # GPU dependency stack is not pulled into this job.
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check src benchmarks submits

      - name: Type smoke (pyright)
        # pyproject sets typeCheckingMode=off + reportMissingImports=warning, so this
        # is an import/syntax smoke check (missing torch/triton -> warnings, not errors).
        run: pyright

      - name: Public API contract + static guards
        # CPU-only subset: frozen kernel surface, side-effect-free import, int64
        # guards, and ProteinMPNN reference/core numerics (CUDA cases skip here).
        # GPU kernel numerics and direct CUDA MPNN parity run on an allocated node
        # via `pixi run test-gpu` (see README / pixi tasks).
        run: >
          pytest -q
          tests/test_public_api.py
          tests/test_lazy_kernel_exports.py
          tests/test_int64_offsets.py
          tests/test_mpnn_reference.py
          tests/test_mpnn_conversion.py
          tests/test_mpnn_numerical.py
          tests/test_mpnn_batch.py
          tests/test_mpnn_benchmark_workload.py
          tests/test_mpnn_message_kernel.py
          tests/test_mpnn_edge_mlp_kernel.py
          tests/test_mpnn_edge_layernorm.py
          tests/test_mpnn_encoder_node_recompute.py
          tests/test_mpnn_transition_recompute.py
          tests/test_mpnn_edge_dropout.py
