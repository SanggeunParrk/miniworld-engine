# AttentionPairBias (Pairformer single track) at MiniWorld's shape: d_single=384, d_pair=128,
# 8 heads x 48, B=1, L swept over 384 and 768, token key mask, use_qk_norm=False.
#
#   python benchmarks/runners/bench.py target=attention_pair_bias level=module mode=inference
#
# implementations:
#   pytorch         the module's statements (SDPA + additive pair bias)
#   triton          Triton LayerNorms + the augmented-attention QK+pair-bias kernel (one augmentation)
#   miniworld       auto: the same attention kernel with the engine's auto LayerNorm
#   cuequivariance  cuequivariance_torch.attention_pair_bias (0.12) called with the module's own
#                   parameters + the module's residual: the same function for use_qk_norm=False
#                   (accuracy columns compare it to the fp32 pytorch module). cueq routes per
#                   shape/mode itself; on sm90 compiled inference its policy keeps its native
#                   PyTorch composition, compiled bf16 training takes its fused whole-op route.
#   anthropic has no module-level AttentionPairBias integration: not offered (`unsupported`).
d_single: 384
d_pair: 128
d_single_token: 768
d_single_atom: 128
d_pair_atom: 16

n_layers: 1
n_augment: auto  # unused by this target
mask_prob: 0.0
min_seq_len: 384
max_seq_len: 768
seq_len_step: 384
min_d_pair: 128
max_d_pair: 256
d_pair_step: 128
d_pair_values:
  - 128
  - 256
sweep_axis: seq_len
sweep_seq_len: 384
target: attention_pair_bias
level: module
implementations:
  - pytorch
  - triton
  - miniworld
  - cuequivariance
mode: inference
metric: time
compile: true
cudagraph: auto  # inference: manual; training time: separate OFF/ON runs
allow_tf32: true
precision: "bf16-mixed"
name_suffix: ""
dropout: auto
trimul_direction: outgoing
