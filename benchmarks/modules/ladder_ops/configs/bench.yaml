d_single: 384
d_pair: 128
d_single_token: 768
d_single_atom: 128
d_pair_atom: 16

n_layers: 1
n_augment: auto  # inference: 5; training: 48
mask_prob: 0.0
per_sample_pair: false  # bias_only_dit training: a pair of its own per sample; unused by other targets
min_seq_len: 384
max_seq_len: 1024
seq_len_step: 128
min_d_pair: 128
max_d_pair: 512
d_pair_step: 128
d_pair_values:
  - 128
  - 256
  - 512
sweep_axis: seq_len
sweep_seq_len: 384
target: ladder_ops
level: module
implementations:
  - pytorch
  - portable
  - miniworld
  # the ops are chosen with +ladder_op=geom|ca|adaln|tpi|smooth_lddt|sampler_augment|sampler_align|sampler_pool|layernorm|rmsnorm
  # (benchmarks/runners/ladder_ops.py); the performance ladder (benchmarks/runners/ladder.py) drives this target.
mode: inference
metric: time
compile: true
cudagraph: auto  # inference: manual; training time: separate OFF/ON runs
allow_tf32: true
precision: "bf16-mixed"
name_suffix: ""
dropout: auto
trimul_direction: outgoing
