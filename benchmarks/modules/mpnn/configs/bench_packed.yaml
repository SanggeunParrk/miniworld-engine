d_single: 384
d_pair: 128
d_single_token: 768
d_single_atom: 128
d_pair_atom: 16
k_neighbors: 48

# Match ProteinMPNN_CSSB train.py::collate: eight logical examples are
# concatenated into physical shape [1, 8 * seq_len, ...].
batch_size: 8
mpnn_layout: packed
mpnn_patch_size: 8
mpnn_coordinate_grad: false
mpnn_message_backend: auto
mpnn_edge_mlp_backend: auto
mpnn_edge_norm_backend: auto
mpnn_edge_dropout_backend: auto
mpnn_feature_backend: auto
mpnn_edge_w1_recompute: "off"
mpnn_encoder_node_w1_recompute: "off"
mpnn_transition_recompute: "off"
n_layers: 3
n_augment: 1
mask_prob: 0.0
min_seq_len: 256
max_seq_len: 512
seq_len_step: 128
seq_len_values:
  - 256
  - 384
  - 512
min_d_pair: 128
max_d_pair: 128
d_pair_step: 128
d_pair_values:
  - 64
  - 128
  - 256
sweep_axis: seq_len
sweep_seq_len: 384

kernel: mpnn
implementations:
  - pytorch
  - miniworld
mode: training
metric: time
compile: true
cudagraph: manual
allow_tf32: true
# Large-shape parity is covered separately to avoid holding two autograd
# graphs during the measurement run.
check_correctness: false
# The source training script has USE_AMP=False; this is the faithful baseline.
precision: 32
name_suffix: "packed_b8_fp32"
