# MSAPairWeightedAveraging at MiniWorld's MSA-module shape: d_msa=64, d_pair=128, 8 heads x 32
# (MiniWorld passes d_hidden_msa=32), B=1, MSA depth S = BenchConfig.n_msa (default 1024;
# +n_msa=2048 for v1.1), L swept over 384 and 768, token key mask. Training uses MiniWorld's
# p_drop_msa = 0.15 row dropout (dropout: auto); with dropout the accuracy columns stay blank.
#
#   python benchmarks/runners/bench.py target=msa_pair_weighted_averaging level=module mode=inference
#
# implementations:
#   pytorch    the module's statements
#   miniworld  auto: integrations/pwa_train.py (CUDA pair_fwd3 / ln_vg / pwa_fwd2 forward, fused
#              backward, residual + dropout in-kernel) on sm_90a bf16; see `execution_path`
#   anthropic  PRISTINE: opt_core.ops.msa_pwa.forward_masked exactly as shipped (shipped default
#              _CFG[32] = the fo kernel with the fused LN_m/proj prologue), STOCK LayerNorm for norm_z
#              and norm_m on this module's parameters, key mask broadcast over queries, bf16
#              autocast; the engine adds the residual. INFERENCE ONLY -- training `unsupported`.
#              Needs MINIWORLD_ANTHROPIC_ROOT (cssb: /home/psk6950/ext/uplifting-biomolecular-modeling).
#              FPF_PWA_CFG is unset for the row.
#   anthropic_hybrid  integrations/anthropic_msa.py: the upstream msa_pwa cell (g_fo4p) with OUR
#              fused LayerNorm substituted for norm_z. Needs OPT_CORE_DIR=$MINIWORLD_ANTHROPIC_ROOT/
#              common/opt_core. The harness pins MINIWORLD_PWA_TRAIN=0 / MINIWORLD_PWA_INFER=0 for
#              both anthropic labels and masks OPT_CORE_DIR for every non-anthropic row.
#   cuequivariance ships no pair-weighted-averaging kernel: not offered (`unsupported`).
d_single: 384
d_pair: 128
d_single_token: 768
d_single_atom: 128
d_pair_atom: 16

n_layers: 1
n_augment: auto  # unused by this target
mask_prob: 0.0
min_seq_len: 384
max_seq_len: 768
seq_len_step: 384
min_d_pair: 128
max_d_pair: 128
d_pair_step: 128
d_pair_values:
  - 128
sweep_axis: seq_len
sweep_seq_len: 384
target: msa_pair_weighted_averaging
level: module
implementations:
  - pytorch
  - miniworld
  - anthropic
mode: inference
metric: time
compile: true
cudagraph: auto  # inference: manual; training time: separate OFF/ON runs
allow_tf32: true
precision: "bf16-mixed"
name_suffix: ""
dropout: auto  # training: 0.15 (MiniWorld p_drop_msa); inference: 0
trimul_direction: outgoing
