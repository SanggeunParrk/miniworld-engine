# OuterProductMean at MiniWorld's MSA-module shape: d_msa=64, d_hidden=32, d_pair=128, B=1,
# MSA depth S = BenchConfig.n_msa (default 1024, MiniWorld v1.2 msa_subsample_per_recycle;
# override with +n_msa=2048 for v1.1), L swept over 384 and 768 tokens. The running pair is the
# cross-tensor residual, as in `pair = opm(msa, mask, residual=pair)`.
#
#   python benchmarks/runners/bench.py target=outer_product level=module mode=inference
#
# implementations:
#   pytorch    the module's statements (fp32 mask count)
#   miniworld  auto: integrations/opm_train.py (fused prologue + cuBLAS + csrc/opm_epilogue.cu,
#              forward and backward) on sm_90a bf16; the served path is in `execution_path`
#   anthropic  PRISTINE: opt_core.ops.msa_opm.forward_mask_norm exactly as shipped (upstream fused
#              LN/projection/mask prologue + ONE Triton outer-product/projection kernel, shipped
#              default tile config for this card), on this module's weights viewed under the
#              release's norm/proj_a/proj_b/proj_o schema, stock LayerNorm parameters, bf16 autocast;
#              the engine adds the residual. INFERENCE ONLY -- training rows are `unsupported`.
#              Needs MINIWORLD_ANTHROPIC_ROOT=<checkout containing common/opt_core>
#              (cssb: /home/psk6950/ext/uplifting-biomolecular-modeling). FPF_OPM_CFG is unset for the row.
#   anthropic_hybrid  integrations/anthropic_msa.py: upstream msa_opm prologue + cuBLAS + OUR
#              csrc/opm_epilogue.cu. Needs OPT_CORE_DIR=$MINIWORLD_ANTHROPIC_ROOT/common/opt_core (the
#              same tree). The harness pins MINIWORLD_OPM_TRAIN=0 for both anthropic labels
#              (opm_train would otherwise serve implementation="anthropic" first) and masks
#              OPT_CORE_DIR for every non-anthropic row.
#   cuequivariance ships no OuterProductMean kernel: not offered (explicitly `unsupported`).
d_single: 384
d_pair: 128
d_single_token: 768
d_single_atom: 128
d_pair_atom: 16

n_layers: 1
n_augment: auto  # unused by this target
mask_prob: 0.0
min_seq_len: 384
max_seq_len: 768
seq_len_step: 384
min_d_pair: 128
max_d_pair: 128
d_pair_step: 128
d_pair_values:
  - 128
sweep_axis: seq_len
sweep_seq_len: 384
target: outer_product
level: module
implementations:
  - pytorch
  - miniworld
  - anthropic
mode: inference
metric: time
compile: true
cudagraph: auto  # inference: manual; training time: separate OFF/ON runs
allow_tf32: true
precision: "bf16-mixed"
name_suffix: ""
dropout: auto
trimul_direction: outgoing
