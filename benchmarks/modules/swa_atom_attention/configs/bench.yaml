d_single: 384
d_pair: 128
d_single_token: 768
d_single_atom: 128
d_pair_atom: 16

n_layers: 1
n_augment: auto  # inference: 5; training: 48
mask_prob: 0.0
min_seq_len: 128
max_seq_len: 384
seq_len_step: 64
min_d_pair: 128
max_d_pair: 512
d_pair_step: 128
d_pair_values:
  - 128
  - 256
  - 512
sweep_axis: seq_len
sweep_seq_len: 384

# ESMFold2 SWA atom attention core (Wqkv -> qk-RMSNorm -> 3D RoPE -> windowed attention ->
# sigmoid gate -> out_proj). Runs at atom length = seq_len*8.
# PyTorch uses torch normalization, RoPE and gating; both variants use FlashAttention.
target: swa_atom_attention
level: module
implementations:
  - pytorch
  - miniworld
mode: inference
metric: time
# Both variants compile; inference uses graph replay, training disables graphs.
compile: true
cudagraph: auto  # inference: manual; training time: separate OFF/ON runs
allow_tf32: true
precision: "bf16-mixed"
name_suffix: ""
dropout: auto
trimul_direction: outgoing
