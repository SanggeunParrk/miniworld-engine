d_single: 384
d_pair: 128
d_single_token: 768
d_single_atom: 128
d_pair_atom: 16

n_layers: 1
n_augment: 32
mask_prob: 0.0
min_seq_len: 128
max_seq_len: 384
seq_len_step: 64
min_d_pair: 128
max_d_pair: 512
d_pair_step: 128
d_pair_values:
  - 128
  - 256
  - 512
sweep_axis: seq_len
sweep_seq_len: 384

# ESMFold2 SWA atom attention core (Wqkv -> qk-RMSNorm -> 3D RoPE -> windowed attention ->
# sigmoid gate -> out_proj). Runs at atom length = seq_len*8. Only `miniworld` -- the module has
# no eager variant; every piece is a kernel on CUDA (with a CPU eager fallback for unit tests),
# and the windowed attention needs a flash backend (FA4/FA2) at these lengths, since SDPA's band
# mask is 24 GiB at S=8192.
target: swa_atom_attention
level: module
implementations:
  - miniworld
mode: inference
metric: time
# compile leaves a graph break at the flash op (its unpad path calls torch.nonzero,
# data-dependent); harmless. cudagraph must be DISABLED on sm80: FA2's unpad is not
# CUDA-graph capturable, so `--cudagraph manual` (the CLI default) errors. sm90's FA4
# static-seqused path IS capturable.
compile: true
cudagraph: disabled
allow_tf32: true
precision: "bf16-mixed"
name_suffix: ""
