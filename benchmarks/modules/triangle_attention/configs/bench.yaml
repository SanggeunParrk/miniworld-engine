d_single: 384
d_pair: 128
d_single_token: 768
d_single_atom: 128
d_pair_atom: 16

n_layers: 1
n_augment: auto  # inference: 5; training: 48
mask_prob: 0.0
min_seq_len: 384
max_seq_len: 1024
seq_len_step: 128
min_d_pair: 128
max_d_pair: 512
d_pair_step: 128
d_pair_values:
  - 128
  - 256
  - 512
sweep_axis: seq_len
sweep_seq_len: 384
target: triangle_attention
level: module
implementations:
  - pytorch
  # cuequivariance runs the real cet.triangle_attention kernel (0.10.0), wired via _CUEQ_OPS.
  # anthropic (not in the default list): integrations.anthropic.module_triangle_attention, row
  # block:triattn_native, on the module's own parameters (dispatch rejects the option at module
  # level, so the bench calls the integration adapter; the accuracy columns check it against the
  # fp32 pytorch module). INFERENCE ONLY. Needs MINIWORLD_ANTHROPIC_ROOT=<checkout containing
  # common/opt_core>; on cssb /home/psk6950/ext/uplifting-biomolecular-modeling.
  - cuequivariance
  - miniworld
mode: inference
dropout: auto  # training: 0.25; inference: 0
metric: time
compile: true
cudagraph: auto  # inference: manual; training time: separate OFF/ON runs
allow_tf32: true
precision: "bf16-mixed"
name_suffix: ""
trimul_direction: outgoing
