# Single-bench config (hydra). Override on the CLI, e.g.
#   python benchmarks/runners/bench.py kernel=transition implementations=[pytorch,triton]
#   python benchmarks/runners/bench.py kernel=triangle_multiplication compile=false mode=forward
d_single: 384
d_pair: 128
d_single_token: 768
d_single_atom: 128
d_pair_atom: 16

n_layers: 1
n_augment: 32
mask_prob: 0.2
min_seq_len: 384
max_seq_len: 1024
seq_len_step: 128

# Which op to bench. One of:
#   triangle_multiplication | triangle_attention | transition |
#   adaptive_layernorm | augmented_attention_token | augmented_attention_atom
kernel: triangle_multiplication
implementations:
  - pytorch
  - triton
  - cuequivariance
# TriangleMultiplication also accepts:
#   triton_pytorch_ln | triton_ln
mode: forward          # forward | full (full adds the backward pass)
metric: time           # time | memory
compile: true
allow_tf32: true
precision: "bf16-mixed"
name_suffix: ""
