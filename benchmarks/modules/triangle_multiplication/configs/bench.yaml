# Single-bench config (hydra). Override on the CLI, e.g.
#   python benchmarks/runners/bench.py target=transition level=module implementations=[pytorch,triton]
#   python benchmarks/runners/bench.py target=triangle_multiplication level=module mode=inference
d_single: 384
d_pair: 128
d_single_token: 768
d_single_atom: 128
d_pair_atom: 16

n_layers: 1
trimul_direction: outgoing  # single-direction: outgoing | incoming | alternating
n_augment: auto  # inference: 5; training: 48
mask_prob: 0.0
min_seq_len: 384
max_seq_len: 1024
seq_len_step: 128
min_d_pair: 128
max_d_pair: 512
d_pair_step: 128
d_pair_values:
  - 128
  - 256
  - 512
sweep_axis: seq_len   # seq_len | d_pair
sweep_seq_len: 384
# Which op to bench, and in which namespace. `level: module` targets (this file's set) are
# the folders under benchmarks/modules/:
#   triangle_multiplication | triangle_multiplication_bidirectional | attention_pair_bias |
#   triangle_attention | transition | conditioned_transition | adaptive_layernorm |
#   augmented_attention_token | augmented_attention_atom
# `level: kernel` targets are the folders under benchmarks/kernels/ (same key, other
# namespace: `triangle_attention` exists at both levels).
target: triangle_multiplication
level: module
implementations:
  - pytorch
  - cuequivariance
  - miniworld
# miniworld tries the hand-written CUDA kernels (H100, B200) first and otherwise resolves to the
# triton path on every arch (see modules/dispatch.py). TriangleMultiplication also accepts,
# explicitly:
#   triton | dtv1 | triton_pytorch_ln | triton_ln
#   anthropic -- Anthropic's SHIPPED trimul_native v5 payload through upstream
#   trimul_native.face.serve (integrations/anthropic_trimul.update_unidirectional). INFERENCE ONLY
#   (training rows are `unsupported`). The harness sets TRIMUL_NATIVE_BUILD_DIR for the row itself:
#   $ANTHROPIC_TRIMUL_BUILD_DIR if set, else
#   $MINIWORLD_ANTHROPIC_ROOT/common/opt_core/opt_core/kernels/trimul/native/pkg/v5/build
#   (cssb: /home/psk6950/ext/uplifting-biomolecular-modeling/...; units z128_h128 + z128_h256).
#   A payload with OVERLAY.json beside build/ is refused for this label. The shipped cubins are
#   built by nvcc 13.0: a driver older than CUDA 13 may refuse to load them (the row then reports
#   the loader error); ANTHROPIC_TRIMUL_BUILD_DIR can name a local rebuild of the unmodified sources.
#   On B200 (no sm_100 binary ships) that rebuild carries the sm_80 member built for sm_100a
#   (miniworld-engine dev build-anthropic-sm100a; docs/kernels/anthropic-trimul-payload.md, B200).
#   anthropic_hybrid -- the same module path on the payload the CALLER exported in
#   TRIMUL_NATIVE_BUILD_DIR, e.g. this repo's K1/K3 overlay build
#   (built from tag archive/experiments-20260928, see docs/kernels/anthropic-trimul-payload.md).
#   Run it in a separate invocation from `anthropic`: one process loads one payload.
#   Every other row runs with the payload variables masked, so miniworld stays our kernels.
mode: inference        # inference | training
dropout: auto  # training: 0.25; inference: 0
metric: time           # time | memory
compile: true
cudagraph: auto  # inference: manual; training time: separate OFF/ON runs
allow_tf32: true
precision: "bf16-mixed"
name_suffix: ""
