# Single-bench config (hydra). Override on the CLI, e.g.
#   python benchmarks/runners/bench.py target=transition level=module implementations=[pytorch,miniworld]
#   python benchmarks/runners/bench.py target=triangle_multiplication level=module mode=inference
d_single: 384
d_pair: 128
d_single_token: 768
d_single_atom: 128
d_pair_atom: 16

n_layers: 1
trimul_direction: outgoing  # single-direction: outgoing | incoming | alternating
n_augment: auto  # inference: 5; training: 48
mask_prob: 0.0
per_sample_pair: false  # bias_only_dit training: a pair of its own per sample; unused by other targets
min_seq_len: 384
max_seq_len: 1024
seq_len_step: 128
min_d_pair: 128
max_d_pair: 512
d_pair_step: 128
d_pair_values:
  - 128
  - 256
  - 512
sweep_axis: seq_len   # seq_len | d_pair
sweep_seq_len: 384
# Which op to bench, and in which namespace. `level: module` targets (this file's set) are
# the folders under benchmarks/modules/:
#   triangle_multiplication | triangle_multiplication_bidirectional | attention_pair_bias |
#   triangle_attention | transition | conditioned_transition | adaptive_layernorm |
#   augmented_attention_token | augmented_attention_atom
# `level: kernel` targets are the folders under benchmarks/kernels/ (same key, other
# namespace: `triangle_attention` exists at both levels).
target: triangle_multiplication_bidirectional
level: module
# cuEquivariance composition shares the same 2h output LayerNorm as MiniWorld.
implementations:
  - pytorch
  - cuequivariance
  - miniworld
# miniworld tries the hand-written CUDA kernels (H100, B200) first and otherwise runs the internal Triton
# family only on a card with a record, else a warning and the PyTorch reference (docs/dispatch.md).
# TriangleMultiplication also accepts, explicitly (A/B rows: miniworld under settings.force_portable_kernels):
#   portable | dtv1 | portable_pytorch_ln | portable_ln
#   anthropic -- Anthropic's SHIPPED trimul_native v5 payload (unit tmn90_z128_h256: the
#   bidirectional module is ONE unit at twice the hidden width). Upstream has no bidirectional
#   entry point, so integrations/anthropic_trimul.update_bidirectional composes upstream primitives
#   (ops.planes = K1, two torch.bmm contractions, ops.epilogue = K3): upstream kernels, engine
#   composition. INFERENCE ONLY. The harness sets TRIMUL_NATIVE_BUILD_DIR for the row to
#   $ANTHROPIC_TRIMUL_BUILD_DIR or $MINIWORLD_ANTHROPIC_ROOT/common/opt_core/opt_core/kernels/
#   trimul/native/pkg/v5/build and refuses an overlay payload; the shipped cubins are nvcc 13.0.
#   On B200 the shipped payload has no sm_100 binary: point ANTHROPIC_TRIMUL_BUILD_DIR at a copy
#   with the sm_80 member built for sm_100a (miniworld-engine dev build-anthropic-sm100a; see
#   docs/kernels/anthropic-trimul-payload.md, B200).
#   anthropic_hybrid -- the payload the caller exported in TRIMUL_NATIVE_BUILD_DIR (an overlay
#   build needs the tmn90_z128_h256 unit: build_payload.py --unit tmn90_z128_h256). Separate
#   invocation from `anthropic`. Masked for every non-anthropic row.
mode: inference        # inference | training
dropout: auto  # training: 0.25; inference: 0
metric: time           # time | memory
compile: true
cudagraph: auto  # inference: manual; training time: separate OFF/ON runs
allow_tf32: true
precision: "bf16-mixed"
name_suffix: ""
