# E5, ALL operator classes and ALL candidates: AF3 setup only, L 512 / 1024 / 2048, eval and train, 20 timed iterations (warmup 5).
# One config for every candidate: run_measure.py --ext <names of externals.AVAILABLE>. A backend serves only the classes its adapter attaches to; a case a library
# does not serve is recorded `unsupported` with the reason (never re-routed). Classes: TriAttn, TriMul (outgoing), AttentionPairBias (384 / 16 heads and the
# 768-channel 16 x 48 token-DiT row), OPM, PWA, Transition (d_hidden 128 n 4 and d_hidden 64 n 4).
requirements: requirements_e5_all.csv   # relative to this file
modules: all
backends: [pytorch, cuda, cueq, ds4sci, trifast, fast_trimul, gpumode, geonn, gnops, of3tri, megafold, bionemo_ir, turbopf, ligo_pwa, megafold_tr]
external: [cueq, ds4sci, trifast, fast_trimul, gpumode, geonn, gnops, of3tri, megafold, bionemo_ir, turbopf, ligo_pwa, megafold_tr]
rows: []
dtypes: []
modes: []
lengths: all
depths: min
samples: min
timing: [graph]
warmup: 5
iterations: 20
flush_l2: true
device: cuda
seed: 0
