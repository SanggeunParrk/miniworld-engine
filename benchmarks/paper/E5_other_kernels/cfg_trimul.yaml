# E5, triangle multiplication: TriMul outgoing, AF3 setup only (d_pair=128), L 512 / 1024 / 2048, eval and train, 20 timed iterations with the external TriMul backends
# of ext_trimul_registry.py (run through run_ext_trimul.py --ext fast_trimul gpumode geonn), next to the PyTorch reference and the engine's cuda.
# A case a library does not serve is recorded `unsupported` with its reason.
requirements: requirements_trimul_e5.csv   # relative to this file: TriMul outgoing, AF3 setup only (d_pair=128, p_drop 0.25), L 512 / 1024 / 2048
modules: [TriangleMultiplication]
backends: [pytorch, cuda, fast_trimul, gpumode, geonn]
external: [fast_trimul, gpumode, geonn]
rows: []
dtypes: []
modes: []
lengths: all
depths: min
samples: min
timing: [graph]
warmup: 5
iterations: 20
flush_l2: true
device: cuda
seed: 0
