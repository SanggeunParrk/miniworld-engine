[workspace]
channels = ["conda-forge"]
name = "tm1-cute"
platforms = ["linux-64"]
version = "0.1.0"
description = "Dedicated env for the TM1 CuTeDSL kernel and its bench."

[dependencies]
python = "3.10.*"
pip = "*"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]

[pypi-dependencies]
# Match node01 driver (575.x, CUDA 12.9-capable) — torch built for cu128.
torch = ">=2.8,<2.12"
nvidia-cutlass-dsl = "==4.4.2"
# quack ships the SM90 helpers FA4 uses (sm90_utils, copy_utils, layout_utils).
quack-kernels = "==0.3.11"
# Triton + lightweight deps so we can re-bench the existing triton tm1 baseline
# inside this same env (no need to bounce between two envs).
triton = "*"
einops = "*"
jaxtyping = "*"
typing_extensions = "*"
# Fused LayerNorm op used by dtv1 (and useful as a fast LN backend here).
cuequivariance-ops-torch-cu12 = "*"
# High-level cuequivariance triangle_multiplicative_update for baseline.
cuequivariance-torch = ">=0.9.0,<0.10"

[activation.env]
# Force visible device selection at run time via CUDA_VISIBLE_DEVICES outside.
TM1_CUTE_ENV = "1"

[tasks]
smoke = "python -c 'import cutlass.cute as cute; from cutlass.cute.nvgpu import warpgroup; print(\"cute ok\")'"
gpu-smoke = "python -c 'import torch; print(torch.__version__, torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else None)'"
