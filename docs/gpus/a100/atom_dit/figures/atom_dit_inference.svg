<text x="1024.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">I3 · pair bias</text>
<text x="1024.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · pair_bias_fwd_kernel</text>
<text x="1024.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">bias[h] = rstd (z · W'[h] − mean Σ<tspan baseline-shift="sub" font-size="75%">c</tspan> W'[h, c])    # W' = γ Wb</text>
<text x="1024.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">masked and padded keys = −1e4, padded query rows 0</text>
