<text x="30.0" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#57606a" text-anchor="start">one block, A samples with a conditioning per atom; the pair bias is made on every call (the pair tensor is read once per block)</text>
