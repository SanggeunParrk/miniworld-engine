<text x="30.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">A100 · atom DiT block (AF3 Alg. 23, dense attention over all N atoms) · inference · d 128, cond 128, pair 16, 4 heads × 32, transition n = 2, bf16</text>
<text x="3428.0" y="24.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b3261e" text-anchor="end">red: written to HBM</text>
