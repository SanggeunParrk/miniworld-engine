<line x1="30" y1="465" x2="662" y2="465" stroke="#1f2328" stroke-width="1"/>
<text x="40.0" y="438.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">L2 · dx and the weight-gradient partials</text>
<text x="40.0" y="456.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · lnl_bwd_kernel</text>
<text x="40.0" y="485.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dxn = dout @ W;   s1 = dout · (W γ);   s2 = dout · u</text>
<text x="40.0" y="500.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dx = rstd (dxn γ - s1 / D - x̂ s2 / D)     # x̂ rebuilt from x, mean, rstd</text>
<text x="40.0" y="515.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">Gn_partial += doutᵀ @ x̂                   # mma over the rows, summed per CTA in shared memory</text>
