<rect width="2598" height="405" fill="#ffffff"/>
<text x="30.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">A100 · SWA atom DiT block (ESMFold2 style: sliding window |i − j| ≤ 64, 3D RoPE, per-head RMS norm, SwiGLU 256) · inference · d 128, cond 128, 4 heads × 32, bf16</text>
<text x="2568.0" y="24.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b3261e" text-anchor="end">red: written to HBM</text>
<text x="2568.0" y="38.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a5fb4" text-anchor="end">blue, dashed: read from HBM</text>
<text x="30.0" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#57606a" text-anchor="start">one block, A samples with a conditioning per atom (mod per row of c); with one conditioning for the A samples (forward_hoisted) I1 runs on S rows instead of A S</text>
<rect x="30" y="70" width="600" height="124" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M36,70 h588 a6,6 0 0 1 6,6 v40 h-600 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
