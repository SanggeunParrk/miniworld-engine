<text x="1198.0" y="264.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">G [M,128]</text>
<rect x="1322" y="70" width="600" height="124" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M1328,70 h588 a6,6 0 0 1 6,6 v40 h-600 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
<line x1="1322" y1="116" x2="1922" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="1332.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">I3 · window attention</text>
<text x="1332.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · attn_fwd_kernel</text>
<text x="1332.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">s = q·kᵀ / √32  for |i − j| ≤ 64, i and j &lt; seqused</text>
<text x="1332.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">o = softmax(s) v         # per sample and head, one pass over the window</text>
<line x1="1922.0" y1="93.0" x2="1965.0" y2="93.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#head-1f2328)"/>
<line x1="1394.0" y1="293.0" x2="1394.0" y2="196.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="1400.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">Q, K, V</text>
<text x="1400.0" y="225.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">seqused</text>
<line x1="1850.0" y1="194.0" x2="1850.0" y2="291.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="1844.0" y="238.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">O [M,128]</text>
<text x="1844.0" y="251.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">lse [N,4,S]</text>
<rect x="1968" y="70" width="600" height="124" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M1974,70 h588 a6,6 0 0 1 6,6 v40 h-600 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
<line x1="1968" y1="116" x2="2568" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="1978.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">I4 · gated out-projection, RMS-adaLN, SwiGLU FFN</text>
<text x="1978.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · ffn_fwd_kernel</text>
<text x="1978.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">q1 = q + gate_a · rn(rn(sigmoid(G) · O) Woᵀ)</text>
<text x="1978.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">y = rn(rn(q1 · rstd) (1 + scale_f) + shift_f)</text>
<text x="1978.0" y="166.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">h = rn(a sigmoid(a) b),   a | b = y Wuᵀ        # hidden 256</text>
<text x="1978.0" y="181.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">out = q1 + gate_f · rn(h Wdᵀ)</text>
