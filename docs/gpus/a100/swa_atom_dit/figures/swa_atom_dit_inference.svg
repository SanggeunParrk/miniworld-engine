<path d="M682,70 h588 a6,6 0 0 1 6,6 v40 h-600 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
<line x1="676" y1="116" x2="1276" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="686.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">I2 · RMS-adaLN, q | k | v | g projections, head RMS norm, RoPE</text>
<text x="686.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · qkvg_fwd_kernel</text>
<text x="686.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">x = rn(rn(q · rstd) (1 + scale_a) + shift_a)</text>
<text x="686.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">p = rn(x Wᵀ)      W = Wq | Wk | Wv | Wg</text>
<text x="686.0" y="166.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">Q, K = rn(rope(rn(p · rstd<tspan baseline-shift="sub" font-size="75%">head</tspan>)));  V = p<tspan baseline-shift="sub" font-size="75%">v</tspan>;  G = p<tspan baseline-shift="sub" font-size="75%">g</tspan></text>
<line x1="1276.0" y1="93.0" x2="1319.0" y2="93.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#head-1f2328)"/>
<line x1="748.0" y1="293.0" x2="748.0" y2="196.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="754.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">q (the residual stream)</text>
<text x="754.0" y="225.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">mod cols 0 .. 255, cos, sin</text>
<text x="754.0" y="238.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">Wqkv, Wg</text>
<line x1="1204.0" y1="194.0" x2="1204.0" y2="291.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
