<text x="40.0" y="510.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · tr_bwd_pwg_kernel&lt;D, H&gt;</text>
<text x="40.0" y="539.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dh, a, b = dy @ W_s[:, s], x_n @ W_a[s].T, x_n @ W_b[s].T</text>
<text x="40.0" y="554.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">h, dA, dB = swiglu_bwd(dh, a, b)</text>
<text x="40.0" y="569.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dW_s[:, s] += dy.T @ h</text>
<text x="40.0" y="584.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dW_a[s] += dA.T @ x_n;  dW_b[s] += dB.T @ x_n   # f32 partials</text>
