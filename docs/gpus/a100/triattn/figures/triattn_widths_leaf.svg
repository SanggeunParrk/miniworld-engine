<text x="2183.3" y="544.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">lse, Δ, bias_t, mask</text>
<line x1="2666.7" y1="513.0" x2="2666.7" y2="601.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
