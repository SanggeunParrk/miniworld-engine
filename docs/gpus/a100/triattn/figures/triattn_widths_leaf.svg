<line x1="2790" y1="465" x2="3434" y2="465" stroke="#1f2328" stroke-width="1"/>
<text x="2800.0" y="438.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">B4 · attention backward, query side</text>
<text x="2800.0" y="456.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · attn2_bwd_dq_kernel, db_reduce_kernel</text>
<text x="2800.0" y="485.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dS = P (do v^T - Δ);  dq = sm_scale · dS @ k</text>
