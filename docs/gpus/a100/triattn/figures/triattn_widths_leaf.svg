<text x="570.0" y="333.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#57606a" text-anchor="start">[L,1,L] bool  0.6 MB</text>
<text x="30.0" y="409.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#57606a" text-anchor="start">training: forward (saves out, lse), then backward</text>
<rect x="30" y="419" width="644" height="94" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M36,419 h632 a6,6 0 0 1 6,6 v40 h-644 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
