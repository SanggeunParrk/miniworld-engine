<text x="2110.0" y="438.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">B3 · attention backward, key side</text>
<text x="2110.0" y="456.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · attn2_bwd_dkv_kernel</text>
<text x="2110.0" y="485.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">P^T = exp2(scale · k q^T + bias_t - lse) (0 on masked keys);  dS^T = P^T (v do^T - Δ)</text>
<text x="2110.0" y="500.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dv = P^T do;   dk = sm_scale · dS^T q</text>
