<text x="1843.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · bias_planes_kernel</text>
<text x="1843.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">bias[h, i, j] = y[(i, j), bias head h]  masked to min  # head planes [H, L, L]</text>
