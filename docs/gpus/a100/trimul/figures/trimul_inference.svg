<text x="83.4" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">W_l, W_lg, W_r, W_rg (any strides)</text>
<text x="83.4" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">W_g, W_o</text>
<text x="83.4" y="253.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">γ, β, γ_o, β_o</text>
<line x1="377.6" y1="209.0" x2="377.6" y2="319.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="371.6" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">w1, W_g', W_o'</text>
<text x="371.6" y="279.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">s, b (row sums, bias terms)</text>
