<rect width="1778" height="481" fill="#ffffff"/>
<text x="30.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">A100 · TriMul · inference · D128, bf16, L a multiple of 16 (one direction: H = 128, P = 2H = 256 planes; bidirectional: H = 256, P = 512)</text>
<text x="1748.0" y="24.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b3261e" text-anchor="end">red: written to HBM</text>
