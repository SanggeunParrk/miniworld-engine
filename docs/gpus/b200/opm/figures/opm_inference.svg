<text x="768.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">n = popc(bits_i &amp; bits_j).clamp(min=1)</text>
