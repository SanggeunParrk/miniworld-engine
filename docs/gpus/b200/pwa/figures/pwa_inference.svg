<rect width="1470" height="396" fill="#ffffff"/>
<text x="30.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">B200 · MSAPairWeightedAveraging · inference · d_msa 64, d_pair 128, 8 heads × 32, bf16, MSA residual</text>
<text x="1440.0" y="24.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b3261e" text-anchor="end">red: written to HBM</text>
