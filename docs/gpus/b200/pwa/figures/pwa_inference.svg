<path d="M1128,70 h306 a6,6 0 0 1 6,6 v40 h-318 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
<line x1="1122" y1="116" x2="1440" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="1132.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">F4 · gate + out projection + residual</text>
<text x="1132.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · pwa_gate_out</text>
<text x="1132.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">y = LN_m(m)   # recomputed</text>
<text x="1132.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">g = sigmoid(y @ W_g.T)   # bf16, as the module</text>
<text x="1132.0" y="166.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">out = m + (g * o) @ W_o.T</text>
<line x1="1160.2" y1="284.0" x2="1160.2" y2="196.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="1166.2" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">o</text>
<text x="1166.2" y="225.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">m</text>
<text x="1166.2" y="238.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">γ_m, β_m, W_g, W_o</text>
<line x1="1401.8" y1="194.0" x2="1401.8" y2="282.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="1395.8" y="251.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">out</text>
