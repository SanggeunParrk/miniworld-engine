<text x="438.2" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">m</text>
<text x="438.2" y="225.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">γ_m, β_m, W_v</text>
<line x1="673.8" y1="194.0" x2="673.8" y2="282.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="667.8" y="238.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">v</text>
<rect x="758" y="70" width="318" height="124" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M764,70 h306 a6,6 0 0 1 6,6 v40 h-318 v-40 a6,6 0 0 1 6,-6 z" fill="#dbe7fb"/>
<line x1="758" y1="116" x2="1076" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="768.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">F3 · weighted average</text>
<text x="768.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">cuBLAS · bmm</text>
<text x="768.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">o = w @ v   # [H, L, S·32]</text>
<text x="768.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># = einsum("bhij,bmjhd-&gt;bmihd")</text>
