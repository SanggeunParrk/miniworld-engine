<text x="40.0" y="505.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">B1 · fused backward (weight role + input role)</text>
<text x="40.0" y="523.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · transition_bwd_sm100 (2-CTA)</text>
<text x="40.0" y="552.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># weight role, one hidden slice s per CTA:</text>
<text x="40.0" y="567.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dh, a, b = dy @ W_s[:, s], x_n @ W_a[s].T, x_n @ W_b[s].T</text>
<text x="40.0" y="582.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">h, dA, dB = swiglu_bwd(dh, a, b)</text>
<text x="40.0" y="597.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dW_s[:, s] += dy.T @ h</text>
<text x="40.0" y="612.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dW_a[s] += dA.T @ x_n;  dW_b[s] += dB.T @ x_n</text>
<text x="40.0" y="627.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># input role, one row tile per CTA:</text>
<text x="40.0" y="642.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">d_xn = Σ_j dA_j @ W_a[j] + dB_j @ W_b[j]</text>
<text x="40.0" y="657.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dx = dy + layer_norm_bwd(d_xn, x, rstd, c1, γ)</text>
