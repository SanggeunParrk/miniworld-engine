<rect width="1202" height="838" fill="#ffffff"/>
<text x="30.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">B200 · Transition (pair, n = 4 / 2) · training · D384, bf16, whole 128-row tiles (more than 16)</text>
<text x="1172.0" y="24.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b3261e" text-anchor="end">red: written to HBM</text>
<text x="1172.0" y="38.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a5fb4" text-anchor="end">blue, dashed: read from HBM</text>
<text x="30.0" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#57606a" text-anchor="start">forward (saves x_n, rstd, c1, h, a, b)</text>
<rect x="30" y="70" width="350" height="154" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M36,70 h338 a6,6 0 0 1 6,6 v40 h-350 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
