<text x="40.0" y="492.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">B1 · gate + d_xn + LayerNorm backward + residual</text>
<text x="40.0" y="510.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · transition_bwd_d384_sm100 (2-CTA)</text>
<text x="40.0" y="539.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">for j in range(n * D // 64):  # 64 hidden units</text>
<text x="40.0" y="554.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">  dh = dy @ W_s[:, j]                   # TMEM</text>
<text x="40.0" y="569.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">  dA, dB = swiglu_bwd(dh, a[j], b[j])  # TMEM + HBM</text>
<text x="40.0" y="584.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">  d_xn += [dA | dB] @ [W_a; W_b][j]     # TMEM</text>
<text x="40.0" y="599.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dx = dy + layer_norm_bwd(d_xn, x, rstd, c1, γ)</text>
<text x="40.0" y="614.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dγ, dβ partials per CTA</text>
