<text x="40.0" y="510.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · transition_bwd_d64_sm100 (2-CTA)</text>
<text x="40.0" y="539.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># weight role: 4 hidden slices x 20 replicas</text>
<text x="40.0" y="554.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dh, a, b = dy @ W_s[:, s], x_n @ W_a[s].T, x_n @ W_b[s].T</text>
<text x="40.0" y="569.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">h, dA, dB = swiglu_bwd(dh, a, b)</text>
<text x="40.0" y="584.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dW_s[:, s] += dy.T @ h;  dW_a|b[s] += dA|B.T @ x_n</text>
<text x="40.0" y="599.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># input role: all weights resident</text>
<text x="40.0" y="614.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">dx = dy + layer_norm_bwd(dA @ W_a + dB @ W_b, ...)</text>
