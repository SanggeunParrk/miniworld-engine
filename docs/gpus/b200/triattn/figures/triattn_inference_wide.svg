<svg xmlns="http://www.w3.org/2000/svg" width="1259" height="420" viewBox="0 0 1259 420">
<defs>
<marker id="head-1f2328" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#1f2328"/></marker>
<marker id="head-b3261e" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#b3261e"/></marker>
<marker id="head-1a5fb4" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#1a5fb4"/></marker>
</defs>
<rect width="1259" height="420" fill="#ffffff"/>
<text x="30.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">B200 · TriangleAttention (starting node) · inference · d_pair C = 64 .. 512, heads × 32 (16-channel heads zero-padded), bf16, every L = 128k</text>
<text x="1229.0" y="24.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b3261e" text-anchor="end">red: written to HBM</text>
<text x="1229.0" y="38.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a5fb4" text-anchor="end">blue, dashed: read from HBM</text>
<text x="30.0" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#57606a" text-anchor="start">forward (nothing saved); HD_p = heads × 32</text>
<rect x="30" y="70" width="369" height="139" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M36,70 h357 a6,6 0 0 1 6,6 v40 h-369 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
<line x1="30" y1="116" x2="399" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="40.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">W1 · LN + q|k|v|g + bias</text>
<text x="40.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · tri_wfront</text>
<text x="40.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">x_n = F.layer_norm(x, (C,), γ, β)   # in shared memory</text>
<text x="40.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">q, k, v, g = (x_n @ W.T for W in W_qkvg)</text>
<text x="40.0" y="166.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">b = (x_n @ W_b.T).permute(0, 3, 1, 2)</text>
<text x="40.0" y="181.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">b = b.masked_fill(~mask[:, None, None], -inf)</text>
<text x="40.0" y="196.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># W streamed in [up to 256 rows][64] chunks</text>
<line x1="399.0" y1="93.0" x2="442.0" y2="93.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#head-1f2328)"/>
<line x1="74.3" y1="308.0" x2="74.3" y2="211.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="80.3" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">x</text>
<text x="80.3" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">W_qkvgb (bf16, packed)</text>
<text x="80.3" y="253.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">γ, β, mask</text>
<line x1="354.7" y1="209.0" x2="354.7" y2="306.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="348.7" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">q, k, v, g</text>
<text x="348.7" y="279.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">b</text>
<rect x="445" y="70" width="369" height="139" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M451,70 h357 a6,6 0 0 1 6,6 v40 h-369 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
<line x1="445" y1="116" x2="814" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="455.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">W2 · attention</text>
<text x="455.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · triattn_fwd</text>
<text x="455.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">s = q[h] @ k[h].T / sqrt(d_head) + b[h]</text>
<text x="455.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">o[h] = torch.softmax(s, -1) @ v[h]</text>
<line x1="814.0" y1="93.0" x2="857.0" y2="93.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#head-1f2328)"/>
<line x1="489.3" y1="308.0" x2="489.3" y2="211.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="495.3" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">q, k, v</text>
<text x="495.3" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">b</text>
<line x1="769.7" y1="209.0" x2="769.7" y2="306.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="763.7" y="253.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">o</text>
<rect x="860" y="70" width="369" height="139" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M866,70 h357 a6,6 0 0 1 6,6 v40 h-369 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
<line x1="860" y1="116" x2="1229" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="870.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">W3 · gate + out proj + residual</text>
<text x="870.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · tri_wtail</text>
<text x="870.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">u = torch.sigmoid(g) * o   # in shared memory</text>
<text x="870.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">y = x + u @ W_o.T</text>
<text x="870.0" y="166.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># W_o streamed in [C][64] chunks</text>
<line x1="904.3" y1="308.0" x2="904.3" y2="211.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="910.3" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">g, o</text>
<text x="910.3" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">x</text>
<text x="910.3" y="253.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">W_o (bf16, packed)</text>
<line x1="1184.7" y1="209.0" x2="1184.7" y2="306.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="1178.7" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">y</text>
<rect x="30" y="308" width="1199" height="88" rx="8" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.4"/>
<text x="42.0" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">HBM (sizes at L = 768, C = HD = 256)</text>
<rect x="42" y="340" width="250" height="40" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="0.8"/>
<text x="50.0" y="356.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1f2328" text-anchor="start">x, y</text>
<text x="50.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#57606a" text-anchor="start">[L,L,C] bf16  302 MB each</text>
<rect x="302" y="340" width="250" height="40" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="0.8"/>
<text x="310.0" y="356.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1f2328" text-anchor="start">q, k, v, g, o</text>
<text x="310.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#57606a" text-anchor="start">[L,L,HD_p] bf16  302 MB each</text>
<rect x="562" y="340" width="250" height="40" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="0.8"/>
<text x="570.0" y="356.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1f2328" text-anchor="start">b</text>
<text x="570.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#57606a" text-anchor="start">[heads,L,L] bf16  9.4 MB</text>
<rect x="822" y="340" width="250" height="40" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="0.8"/>
<text x="830.0" y="356.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1f2328" text-anchor="start">W_qkvgb, W_o, γ, β, mask</text>
<text x="830.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#57606a" text-anchor="start">bf16 / fp32  &lt; 3 MB</text>
</svg>
