</defs>
<rect width="1446" height="420" fill="#ffffff"/>
<text x="30.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">B200 · TriMul · inference · D64 / D128, bf16, every L = 16k (one direction: P = 2D, H = D; bidirectional: P = 4D, H = 2D)</text>
<text x="1416.0" y="24.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b3261e" text-anchor="end">red: written to HBM</text>
<text x="1416.0" y="38.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a5fb4" text-anchor="end">blue, dashed: read from HBM</text>
<text x="30.0" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#57606a" text-anchor="start">forward (nothing saved)</text>
<rect x="30" y="70" width="312" height="139" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M36,70 h300 a6,6 0 0 1 6,6 v40 h-312 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
<line x1="30" y1="116" x2="342" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="40.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">P1 · weight prep</text>
<text x="40.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · k1w_prep</text>
<text x="40.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">w_p' = W_p[:, perm]   # k3g's TMEM K order</text>
<text x="40.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">W_* = W_*.contiguous()  # only if strided</text>
<line x1="342.0" y1="93.0" x2="385.0" y2="93.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#head-1f2328)"/>
<line x1="67.4" y1="308.0" x2="67.4" y2="211.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="73.4" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">W_l, W_lg, W_r, W_rg, W_p</text>
<line x1="304.6" y1="209.0" x2="304.6" y2="306.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="298.6" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">w_p' (, W_* copies)</text>
<rect x="388" y="70" width="312" height="139" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M394,70 h300 a6,6 0 0 1 6,6 v40 h-312 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
<line x1="388" y1="116" x2="700" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="398.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">F1 · input LN + gated proj</text>
<text x="398.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · k1w</text>
<text x="398.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">x_n = F.layer_norm(x, (D,), γ, β)</text>
<text x="398.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">m = mask[:, None] &amp; mask[None, :]</text>
<text x="398.0" y="166.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">a = sigmoid(x_n @ W_lg.T) * (x_n @ W_l.T) * m</text>
<text x="398.0" y="181.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">b = sigmoid(x_n @ W_rg.T) * (x_n @ W_r.T) * m</text>
<text x="398.0" y="196.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># channel-major planes [P, L, L]</text>
<line x1="700.0" y1="93.0" x2="743.0" y2="93.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#head-1f2328)"/>
<line x1="425.4" y1="308.0" x2="425.4" y2="211.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="431.4" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">x</text>
<text x="431.4" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">W_l, W_lg, W_r, W_rg</text>
<text x="431.4" y="253.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">mask [L]</text>
<text x="431.4" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">γ, β</text>
<line x1="662.6" y1="209.0" x2="662.6" y2="306.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="656.6" y="279.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">a, b (planes)</text>
<rect x="746" y="70" width="312" height="139" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M752,70 h300 a6,6 0 0 1 6,6 v40 h-312 v-40 a6,6 0 0 1 6,-6 z" fill="#dbe7fb"/>
<line x1="746" y1="116" x2="1058" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="756.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">F2 · contractions</text>
<text x="756.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">cuBLAS · bmm</text>
<text x="756.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># one direction (outgoing):</text>
<text x="756.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">t = einsum("bikd,bjkd-&gt;bijd", a, b)</text>
<text x="756.0" y="166.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># bidirectional: outgoing on the first</text>
<text x="756.0" y="181.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># half of the planes, incoming on the</text>
<text x="756.0" y="196.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># second, t = cat(t_out, t_in)</text>
<line x1="1058.0" y1="93.0" x2="1101.0" y2="93.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#head-1f2328)"/>
<line x1="783.4" y1="308.0" x2="783.4" y2="211.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="789.4" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">a, b</text>
<line x1="1020.6" y1="209.0" x2="1020.6" y2="306.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="1014.6" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">t</text>
<rect x="1104" y="70" width="312" height="139" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M1110,70 h300 a6,6 0 0 1 6,6 v40 h-312 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
<line x1="1104" y1="116" x2="1416" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="1114.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">F3 · output LN + proj + gate</text>
<text x="1114.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · k3g</text>
<text x="1114.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">o = F.layer_norm(t, (H,), γ_o, β_o) @ W_p.T</text>
<text x="1114.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">x_n = F.layer_norm(x, (D,), γ, β)</text>
<text x="1114.0" y="166.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">g = torch.sigmoid(x_n @ W_g.T)</text>
<text x="1114.0" y="181.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">y = x + ds * (g * o)</text>
<line x1="1141.4" y1="308.0" x2="1141.4" y2="211.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="1147.4" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">t</text>
<text x="1147.4" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">x</text>
<text x="1147.4" y="253.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">w_p', W_g, γ, β, γ_o, β_o</text>
<text x="1147.4" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">ds (dropout only)</text>
<line x1="1378.6" y1="209.0" x2="1378.6" y2="306.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="1372.6" y="279.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">y</text>
