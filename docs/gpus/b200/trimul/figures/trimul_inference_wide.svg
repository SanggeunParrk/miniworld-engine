<rect width="2660" height="433" fill="#ffffff"/>
<text x="30.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">B200 · TriMul · inference · D256 / D384 / D512, bf16, every L = 16k (both LayerNorms folded into the output GEMMs)</text>
<text x="2630.0" y="24.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b3261e" text-anchor="end">red: written to HBM</text>
<text x="2630.0" y="38.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a5fb4" text-anchor="end">blue, dashed: read from HBM</text>
<text x="30.0" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#57606a" text-anchor="start">forward (nothing saved)</text>
<rect x="30" y="70" width="395" height="139" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M36,70 h383 a6,6 0 0 1 6,6 v40 h-395 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
<line x1="30" y1="116" x2="425" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="40.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">F0 · input LN stats</text>
<text x="40.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · k1w_stats</text>
<text x="40.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">μ, σ = x.mean(-1), x.var(-1).add(ε).rsqrt()</text>
<line x1="425.0" y1="93.0" x2="468.0" y2="93.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#head-1f2328)"/>
<line x1="77.4" y1="321.0" x2="77.4" y2="211.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="83.4" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">x</text>
<line x1="377.6" y1="209.0" x2="377.6" y2="319.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="371.6" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">μ, σ</text>
<rect x="471" y="70" width="395" height="139" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M477,70 h383 a6,6 0 0 1 6,6 v40 h-395 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
<line x1="471" y1="116" x2="866" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="481.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">F1 · input LN + gated proj</text>
<text x="481.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · k1w</text>
<text x="481.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">x_n = F.layer_norm(x, (D,), γ, β)</text>
<text x="481.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">m = mask[:, None] &amp; mask[None, :]</text>
<text x="481.0" y="166.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">a = sigmoid(x_n @ W_lg.T) * (x_n @ W_l.T) * m</text>
<text x="481.0" y="181.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">b = sigmoid(x_n @ W_rg.T) * (x_n @ W_r.T) * m</text>
<text x="481.0" y="196.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># channel-major planes [P, L, L]</text>
<line x1="866.0" y1="93.0" x2="909.0" y2="93.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#head-1f2328)"/>
<line x1="518.4" y1="321.0" x2="518.4" y2="211.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="524.4" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">x</text>
<text x="524.4" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">μ, σ</text>
<text x="524.4" y="253.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">W_l, W_lg, W_r, W_rg</text>
<text x="524.4" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">mask [L]</text>
<text x="524.4" y="279.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">γ, β</text>
<line x1="818.6" y1="209.0" x2="818.6" y2="319.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="812.6" y="292.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">a, b (planes)</text>
<rect x="912" y="70" width="395" height="139" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M918,70 h383 a6,6 0 0 1 6,6 v40 h-395 v-40 a6,6 0 0 1 6,-6 z" fill="#dbe7fb"/>
<line x1="912" y1="116" x2="1307" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="922.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">F2 · contractions</text>
<text x="922.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">cuBLAS · bmm</text>
<text x="922.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># one direction (outgoing):</text>
<text x="922.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">t = einsum("bikd,bjkd-&gt;bijd", a, b)</text>
<text x="922.0" y="166.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># bidirectional: outgoing on the first</text>
<text x="922.0" y="181.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># half of the planes, incoming on the</text>
<text x="922.0" y="196.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve"># second, t = cat(t_out, t_in)</text>
<line x1="1307.0" y1="93.0" x2="1350.0" y2="93.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#head-1f2328)"/>
<line x1="959.4" y1="321.0" x2="959.4" y2="211.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="965.4" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">a, b</text>
<line x1="1259.6" y1="209.0" x2="1259.6" y2="319.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="1253.6" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">t</text>
<rect x="1353" y="70" width="395" height="139" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M1359,70 h383 a6,6 0 0 1 6,6 v40 h-395 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
<line x1="1353" y1="116" x2="1748" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="1363.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">F3 · output LN stats</text>
<text x="1363.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · wide_ln_stats</text>
<text x="1363.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">μ_o, σ_o over the H channels of t</text>
<line x1="1748.0" y1="93.0" x2="1791.0" y2="93.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#head-1f2328)"/>
<line x1="1400.4" y1="321.0" x2="1400.4" y2="211.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="1406.4" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">t</text>
<line x1="1700.6" y1="209.0" x2="1700.6" y2="319.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="1694.6" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">μ_o, σ_o</text>
<rect x="1794" y="70" width="395" height="139" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M1800,70 h383 a6,6 0 0 1 6,6 v40 h-395 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
<line x1="1794" y1="116" x2="2189" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="1804.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">F4 · LN-affine fold</text>
<text x="1804.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · wide_fold_prep</text>
<text x="1804.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">W_p' = bf16(W_p * γ_o); s_p = W_p'.sum(1); e_p = W_p @ β_o</text>
<text x="1804.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">W_g' = bf16(W_g * γ); s_g = W_g'.sum(1); e_g = W_g @ β</text>
<line x1="2189.0" y1="93.0" x2="2232.0" y2="93.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#head-1f2328)"/>
<line x1="1841.4" y1="321.0" x2="1841.4" y2="211.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="1847.4" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">W_p, W_g, γ_o, β_o, γ, β</text>
<line x1="2141.6" y1="209.0" x2="2141.6" y2="319.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="2135.6" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">W_p', W_g', s, e</text>
<rect x="2235" y="70" width="395" height="139" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<path d="M2241,70 h383 a6,6 0 0 1 6,6 v40 h-395 v-40 a6,6 0 0 1 6,-6 z" fill="#d9f2e3"/>
<line x1="2235" y1="116" x2="2630" y2="116" stroke="#1f2328" stroke-width="1"/>
<text x="2245.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">F5 · output GEMMs + gate</text>
<text x="2245.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">CUDA · k3w</text>
<text x="2245.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">o = σ_o * (t.T @ W_p'.T - μ_o * s_p) + e_p</text>
<text x="2245.0" y="151.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">g = σ * (x @ W_g'.T - μ * s_g) + e_g</text>
<text x="2245.0" y="166.0" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve">y = x + ds * (sigmoid(g) * o)</text>
<line x1="2282.4" y1="321.0" x2="2282.4" y2="211.0" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#head-1a5fb4)"/>
<text x="2288.4" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">t (as stored)</text>
<text x="2288.4" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">x</text>
<text x="2288.4" y="253.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">W_p', W_g', s, e</text>
<text x="2288.4" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">μ, σ, μ_o, σ_o</text>
<text x="2288.4" y="279.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#1a5fb4" text-anchor="start">ds (dropout only)</text>
<line x1="2582.6" y1="209.0" x2="2582.6" y2="319.0" stroke="#b3261e" stroke-width="1.6" marker-end="url(#head-b3261e)"/>
<text x="2576.6" y="292.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="end">y</text>
<rect x="30" y="321" width="2600" height="88" rx="8" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.4"/>
<text x="42.0" y="343.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">HBM (sizes at L = 768, D512 bidirectional)</text>
