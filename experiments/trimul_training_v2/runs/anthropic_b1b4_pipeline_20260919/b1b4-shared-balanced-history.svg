<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1330" role="img" aria-labelledby="title desc"><title id="title">B1–B4 CUDA: 40 DW plus 92 DX CTAs in one launch</title><desc id="desc">Anthropic v5 based training extension; two input stages per role, register LN, no global dp or dnorm; B5+ remains Triton.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58717b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18343f}.edge{fill:none;stroke:#58717b;stroke-width:2;marker-end:url(#arr)}</style><rect width="1200" height="1330" fill="#f4f8fa"/><text x="35" y="45" font-size="26" font-weight="700">TriMul 학습 B1–B4 · dual_balanced · 현재 선택안</text><text x="35" y="76" font-size="16" font-weight="400">Anthropic v5 CUDA primitives 계승 · 1 cooperative launch · 132 CTAs × 256 threads</text><rect x="35" y="100" width="1130" height="90" rx="12" fill="#e9eff4" stroke="#a7bac6" stroke-width="1.5"/><text x="55" y="129" font-size="18" font-weight="700">입력 / forward 저장값 · 변경 없음</text><text x="55" y="156" font-size="16" font-weight="400">dy, ds, xn, gate, proj, norm, tri, mean, rstd, gamma, Wp</text><text x="55" y="179" font-size="14" font-weight="400">M=L², C=128, H=256 · dp / dg / dnorm의 BF16 반올림 시점 유지</text><rect x="25" y="216" width="1150" height="754" rx="12" fill="#fff" stroke="#367d70" stroke-width="3"/><text x="48" y="247" font-size="20" font-weight="700">하나의 CUDA 커널 · 내부 CTA 역할을 분리 (cluster / multicast 없음)</text><path d="M322 190V275" class="edge"/><path d="M878 190V275" class="edge"/><rect x="48" y="275" width="535" height="560" rx="12" fill="#edf8f3" stroke="#73b099" stroke-width="1.5"/><rect x="615" y="275" width="535" height="560" rx="12" fill="#eef3fc" stroke="#8fa9d4" stroke-width="1.5"/><text x="70" y="309" font-size="20" font-weight="700">DW · 40 CTAs · B1 + B2 + B3b</text><text x="70" y="340" font-size="16" font-weight="400">TMA: dy, gate, proj, xn, norm</text><text x="70" y="365" font-size="16" font-weight="400">96 KiB slot0 ↔ 96 KiB slot1</text><path d="M315 379V405" class="edge"/><rect x="70" y="405" width="491" height="91" rx="12" fill="#fff" stroke="#a7bac6" stroke-width="1.5"/><path d="M315 496V526" class="edge"/><rect x="70" y="526" width="491" height="155" rx="12" fill="#fff" stroke="#a7bac6" stroke-width="1.5"/><path d="M315 681V709" class="edge"/><text x="637" y="309" font-size="20" font-weight="700">DX / LN · 92 CTAs · B1 + B3a + B4</text><text x="637" y="340" font-size="16" font-weight="400">TMA: dy, gate, tri + resident Wp</text><text x="637" y="365" font-size="16" font-weight="400">64 KiB slot0 ↔ 64 KiB slot1 + 64 KiB Wp</text><path d="M882 379V405" class="edge"/><rect x="637" y="405" width="491" height="91" rx="12" fill="#fff" stroke="#a7bac6" stroke-width="1.5"/><path d="M882 496V526" class="edge"/><rect x="637" y="526" width="491" height="155" rx="12" fill="#fff" stroke="#a7bac6" stroke-width="1.5"/><path d="M882 681V709" class="edge"/><text x="87" y="432" font-size="17" font-weight="700">B1 · y=dy×ds; dp=bf16(y×gate)</text><text x="87" y="458" font-size="16" font-weight="400">dg=bf16(y×proj×gate×(1−gate))</text><text x="87" y="482" font-size="14" font-weight="400">dp / dg → shared; dg는 global 출력으로도 기록</text><text x="654" y="432" font-size="17" font-weight="700">B1 · y=dy×ds; dp=bf16(y×gate)</text><text x="654" y="458" font-size="16" font-weight="400">DX 역할에서 dp를 다시 계산 → shared</text><text x="654" y="482" font-size="14" font-weight="400">DW의 dp를 global로 주고받지 않음</text><text x="87" y="555" font-size="17" font-weight="700">WGMMA · 두 WG가 6개 weight tile 분담</text><text x="87" y="585" font-size="16" font-weight="400">B2: dWg += xnᵀ @ dg</text><text x="87" y="615" font-size="16" font-weight="400">B3b: dWp += dpᵀ @ norm</text><text x="87" y="644" font-size="14" font-weight="400">FP32 192 accumulators/thread · tile 반복 누적</text><text x="87" y="666" font-size="14" font-weight="400">owned tile: split, split+40, split+80, …</text><text x="654" y="555" font-size="17" font-weight="700">B3a · WGMMA: dnorm=bf16(dp @ Wp)</text><text x="654" y="585" font-size="16" font-weight="400">dnorm + tri를 register fragment에 유지</text><text x="654" y="615" font-size="17" font-weight="700">B4 · LayerNorm backward</text><text x="654" y="644" font-size="14" font-weight="400">dtri → stmatrix → TMA global store</text><text x="654" y="666" font-size="14" font-weight="400">owned tile: split, split+92, split+184, …</text><text x="70" y="736" font-size="17" font-weight="700">반복 종료: dWg / dWp partial 기록</text><text x="70" y="764" font-size="16" font-weight="400">40 × 49152 FP32 = 7.864 MB</text><text x="70" y="797" font-size="14" font-weight="400">float2 vector store · 두 WG 모두 dW 담당</text><text x="637" y="736" font-size="17" font-weight="700">반복 종료: dgamma / dbeta partial 기록</text><text x="637" y="764" font-size="16" font-weight="400">92 × 512 FP32 = 0.188 MB</text><text x="637" y="797" font-size="14" font-weight="400">warp partial 8 KiB + running sums 2 KiB shared</text><path d="M315 835V864H599V890" class="edge"/><path d="M883 835V864H599" class="edge"/><rect x="70" y="890" width="1058" height="58" rx="12" fill="#f8f0df" stroke="#d7b869" stroke-width="1.5"/><text x="89" y="915" font-size="17" font-weight="700">threadfence → grid ticket barrier → 최종 FP32 reduction → BF16 dW / FP32 LN grads</text><text x="89" y="937" font-size="14" font-weight="400">PART2: 이 launch 안에서 완료 · counters reset / PART1: 별도 unified_reduce fallback 유지</text><path d="M600 970V1004" class="edge"/><rect x="35" y="1004" width="1130" height="79" rx="12" fill="#e9eff4" stroke="#a7bac6" stroke-width="1.5"/><text x="55" y="1035" font-size="17" font-weight="700">6개 출력: dg, dWg, dtri, dgamma, dbeta, dWp</text><text x="55" y="1062" font-size="16" font-weight="400">dg / dtri → 기존 Triton B5+ · forward 저장값과 후속 연결 그대로</text><rect x="35" y="1110" width="1130" height="186" rx="12" fill="#fff" stroke="#a7bac6" stroke-width="1.5"/><text x="55" y="1140" font-size="17" font-weight="700">Dropout 25% · CUDA events · 3 × 200 samples · Triton/cuBLAS 기준</text><text x="55" y="1170" font-size="20" font-weight="700">L384: 299.52 → 176.00 µs (1.702×)     L768: 1182.08 → 620.48 µs (1.905×)</text><text x="55" y="1200" font-size="16" font-weight="400">전체 backward: 1.122× / 1.143× · 실험 경로이며 production 기본값은 아직 미변경</text><text x="55" y="1228" font-size="16" font-weight="400">partial 읽기+쓰기 52.45 → 16.11 MB (global traffic; 전부 HBM은 아님)</text><text x="55" y="1256" font-size="16" font-weight="400">252 registers, spill 0 · required 24 cases + sanitizer 통과 · NCU DRAM 60.5% / 70.6%</text><text x="55" y="1280" font-size="14" font-weight="400">L384 절대 173 µs 목표 미달. 추가 L72 한 seed의 원본 수치오차는 상세 보고서에 명시.</text></svg>