<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1130" role="img" aria-labelledby="title desc"><title id="title">TriMul B1–B4 CUDA · one cooperative kernel</title><desc id="desc">Two warpgroups per CTA share B1 inputs, accumulate dW in FP32 registers, compute dnorm and LayerNorm backward, prefetch the next tile, then reduce global partials inside the same cooperative launch.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#5b7585"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#173548;font-size:17px}.t{font-size:24px;font-weight:700}.b{font-weight:700}.small{font-size:14px;fill:#506879}.edge{fill:none;stroke:#5b7585;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1160" height="1130" fill="#f3f7f8"/><text x="35" y="42" class="t">B1–B4 · CUDA 단일 커널의 실제 배선</text><text x="35" y="70" class="small">H100 · C128 / packed H256 · dropout 25% · 132 CTAs × 256 threads · 각 tile은 64 rows</text><rect x="35" y="92" width="1090" height="102" rx="12" fill="#fff" stroke="#b8ccd5"/><text x="53" y="121" class="b">HBM · forward 저장값과 upstream gradient</text><text x="53" y="147" class="small">dy · gate · projection · x_n · normalized_tri · raw tri · output-LN mean/rstd/gamma · Wp</text><text x="53" y="172" class="small">Forward의 융합·저장 정책 유지. RNG·할당·weight packing은 이 측정 밖.</text><rect x="25" y="216" width="1110" height="615" rx="16" fill="#eaf2f5" stroke="#6b8ba0" stroke-dasharray="7 5"/><text x="45" y="246" class="b">Persistent CTA · shared memory에서 타일을 재사용</text><rect x="55" y="268" width="800" height="105" rx="12" fill="#fff3d8" stroke="#b8ccd5"/><text x="73" y="297" class="b">B1 · dropout + output gate 미분</text><text x="73" y="323" class="small">dy_eff = dy × dropout scale → BF16 dp, dg</text><text x="73" y="348" class="small">128-bit mask 읽기와 dg 쓰기. dp는 HBM에 저장하지 않음.</text><path d="M455 194V268" class="edge"/><rect x="890" y="268" width="215" height="105" rx="12" fill="#fff" stroke="#b8ccd5"/><text x="908" y="297" class="b">HBM output · dg</text><text x="908" y="323" class="small">나중 B9에서 사용</text><text x="908" y="348" class="small">필수 출력은 유지</text><path d="M855 320H890" class="edge"/><rect x="55" y="410" width="505" height="150" rx="12" fill="#e3f4ec" stroke="#b8ccd5"/><text x="73" y="439" class="b">WGMMA · dWg + dWp</text><text x="73" y="465" class="small">WG0: dWg 2 tiles + dWp 1 tile</text><text x="73" y="490" class="small">WG1: dWp 3 tiles</text><text x="73" y="515" class="small">각 warpgroup의 FP32 accumulator를</text><text x="73" y="540" class="small">여러 row tile에 걸쳐 레지스터에 유지</text><rect x="590" y="410" width="515" height="150" rx="12" fill="#e8edfc" stroke="#b8ccd5"/><text x="608" y="439" class="b">WGMMA · dnorm + LN row statistics</text><text x="608" y="465" class="small">dnorm = BF16(dp @ Wp)</text><text x="608" y="490" class="small">WG0 / WG1이 각각 128 channels 담당</text><text x="608" y="515" class="small">GEMM fragment에서 LN backward 합산</text><text x="608" y="540" class="small">dnorm도 shared memory 안에 유지</text><path d="M265 373V410" class="edge"/><path d="M690 373V410" class="edge"/><rect x="590" y="600" width="515" height="137" rx="12" fill="#e8edfc" stroke="#b8ccd5"/><text x="608" y="629" class="b">B4 · output LayerNorm backward</text><text x="608" y="655" class="small">채널 방향으로 읽어 dtri, dgamma, dbeta 계산</text><text x="608" y="680" class="small">dtri는 TMA로 HBM에 출력</text><text x="608" y="705" class="small">다음 입력 80 KiB의 TMA 전송과 겹침</text><path d="M845 560V600" class="edge"/><rect x="55" y="600" width="505" height="137" rx="12" fill="#e2f3f5" stroke="#b8ccd5"/><text x="73" y="629" class="b">다음 타일 준비 · TMA overlap</text><text x="73" y="655" class="small">dy + gate + x_n + normalized_tri 미리 읽기</text><text x="73" y="680" class="small">현재 LN epilogue가 읽지 않는 공간 재사용</text><text x="73" y="705" class="small">projection / raw tri는 현재 타일이 끝난 뒤 읽기</text><path d="M307 600V585H455V373" fill="none" stroke="#148771" stroke-dasharray="6 5" stroke-width="2" marker-end="url(#arrow)"/><text x="65" y="784" class="small">타일 반복 종료 → FP32 부분 dW와 dgamma/dbeta를 global workspace에 기록</text><rect x="55" y="858" width="505" height="112" rx="12" fill="#fff" stroke="#b8ccd5"/><text x="73" y="887" class="b">HBM · FP32 partial workspace</text><text x="73" y="913" class="small">132 CTAs 기준 약 25 MiB</text><text x="73" y="938" class="small">입력 반복 읽기는 줄였지만 부분합 HBM은 존재</text><rect x="590" y="858" width="515" height="112" rx="12" fill="#f0eafa" stroke="#b8ccd5"/><text x="608" y="887" class="b">같은 launch · cooperative grid barrier</text><text x="608" y="913" class="small">모든 CTA가 부분합을 게시한 뒤</text><text x="608" y="938" class="small">전체 CTA가 출력 원소를 나눠 최종 reduction</text><path d="M310 831V858" class="edge"/><path d="M560 913H590" class="edge"/><rect x="55" y="1000" width="1050" height="98" rx="12" fill="#e3f4ec" stroke="#b8ccd5"/><text x="73" y="1029" class="b">최종 출력</text><text x="73" y="1055" class="small">dg · dtri · BF16 dWg / dWp · FP32 dgamma / dbeta</text><text x="73" y="1080" class="small">FP32 dW 누적 → 마지막에 한 번 BF16 반올림. residual gradient는 기존 dy alias.</text><path d="M850 970V1000" class="edge"/></svg>