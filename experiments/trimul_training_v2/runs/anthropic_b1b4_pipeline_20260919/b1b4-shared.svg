<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1450" role="img" aria-labelledby="title desc"><title id="title">B1-B4 saved LN prefetch CUDA wiring</title><desc id="desc">One launch, 40 DW and92 DX CTAs. Mean/rstd prefetch before B1; its barrier publishes stats. Gamma resident per launch; B5 remains Triton.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58717b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18343f}.edge{fill:none;stroke:#58717b;stroke-width:2;marker-end:url(#arr)}</style><rect width="1200" height="1450" fill="#f4f8fa"/><text x="35" y="45" font-size="27" font-weight="700">TriMul 학습 B1–B4 · dual_ln_prefetch</text><text x="35" y="77" font-size="16" font-weight="400">Anthropic v5 CUDA primitives 계승 · 132 CTAs × 256 threads · 1 cooperative launch</text><rect x="35" y="102" width="1130" height="83" rx="12" fill="#e9eff4" stroke="#a7bac6"/><text x="55" y="132" font-size="19" font-weight="700">입력 / forward saves · 수식과 BF16 반올림 유지</text><text x="55" y="162" font-size="16" font-weight="400">dy, ds, xn, gate, proj, norm, tri, mean, rstd, gamma, Wp · M=L² / C128 / H256</text><rect x="25" y="210" width="1150" height="850" rx="12" fill="#fff" stroke="#367d70"/><text x="46" y="243" font-size="21" font-weight="700">하나의 CUDA 커널 · 내부 역할별 CTA 배정</text><path d="M317 185V273" class="edge"/><path d="M881 185V273" class="edge"/><rect x="48" y="273" width="535" height="655" rx="12" fill="#edf8f3" stroke="#a7bac6"/><text x="68" y="307" font-size="19" font-weight="700">DW · 40 CTAs · B1 + B2 + B3b</text><rect x="615" y="273" width="535" height="655" rx="12" fill="#eef3fc" stroke="#a7bac6"/><text x="635" y="307" font-size="19" font-weight="700">DX / LN · 92 CTAs · B1 + B3a + B4</text><text x="70" y="341" font-size="16" font-weight="400">TMA: dy, gate, proj, xn, norm</text><text x="70" y="367" font-size="15" font-weight="400">96KiB slot0 ↔ slot1; mbarrier wait</text><text x="637" y="341" font-size="16" font-weight="400">TMA: dy, gate, tri + resident Wp</text><text x="637" y="367" font-size="15" font-weight="400">64KiB slot0 ↔ slot1 + Wp64KiB; wait</text><rect x="637" y="390" width="491" height="97" rx="12" fill="#fff7d9" stroke="#d7b869"/><text x="654" y="416" font-size="17" font-weight="700">NEW · B1 전에 mean/rstd를 vector preload</text><text x="654" y="443" font-size="15" font-weight="400">shared73728..74752 · 두 tile의 통계 버퍼</text><text x="654" y="469" font-size="15" font-weight="400">gamma: launch마다1회 → shared74752..75776</text><path d="M881 377V390" class="edge"/><path d="M881 487V515" class="edge"/><path d="M315 377V515" class="edge"/><rect x="70" y="515" width="491" height="93" rx="12" fill="#fff" stroke="#a7bac6"/><path d="M315 608V635" class="edge"/><rect x="637" y="515" width="491" height="93" rx="12" fill="#fff" stroke="#a7bac6"/><path d="M882 608V635" class="edge"/><text x="87" y="543" font-size="17" font-weight="700">B1 · dp=bf16(dy×ds×gate)</text><text x="87" y="570" font-size="15" font-weight="400">dg=bf16(((dy×ds)×proj×gate)×(1−gate))</text><text x="87" y="596" font-size="15" font-weight="400">dp/dg → shared; dg → global</text><text x="654" y="543" font-size="17" font-weight="700">B1 · dp를 DX 역할에서 재계산 → shared</text><text x="654" y="570" font-size="15" font-weight="400">기존 B1 CTA barrier가 mean/rstd/γ도 publish</text><text x="654" y="596" font-size="15" font-weight="700">통계용 CTA barrier1회/tile 제거</text><rect x="70" y="635" width="491" height="149" rx="12" fill="#fff" stroke="#a7bac6"/><path d="M315 784V810" class="edge"/><rect x="637" y="635" width="491" height="149" rx="12" fill="#fff" stroke="#a7bac6"/><path d="M882 784V810" class="edge"/><text x="87" y="664" font-size="17" font-weight="700">WGMMA · B2 dWg += xnᵀ @ dg</text><text x="87" y="693" font-size="17" font-weight="700">WGMMA · B3b dWp += dpᵀ @ norm</text><text x="87" y="723" font-size="15" font-weight="400">두 WG가 weight tile6개 분담</text><text x="87" y="750" font-size="15" font-weight="400">FP32 accum192/thread · split+40×round</text><text x="654" y="664" font-size="17" font-weight="700">B3a · WGMMA: dnorm=bf16(dp @ Wp)</text><text x="654" y="693" font-size="16" font-weight="700">B4 · register dnorm/tri + prefetched stats</text><text x="654" y="723" font-size="15" font-weight="400">LN backward → dtri → stmatrix → TMA store</text><text x="654" y="750" font-size="15" font-weight="400">split+92×round · global dp/dnorm 없음</text><text x="70" y="840" font-size="17" font-weight="700">종료: dWg/dWp FP32 partials → global</text><text x="70" y="872" font-size="15" font-weight="400">40×49152 floats =7.864MB</text><text x="637" y="840" font-size="17" font-weight="700">종료: dgamma/dbeta partials → global</text><text x="637" y="872" font-size="15" font-weight="400">92×512 floats =0.188MB · shared sums8+2KiB</text><path d="M315 928V955H600V977" class="edge"/><path d="M881 928V955H600" class="edge"/><rect x="70" y="977" width="1058" height="61" rx="12" fill="#f8f0df" stroke="#d7b869"/><text x="88" y="1002" font-size="17" font-weight="700">threadfence → grid ticket barrier → FP32 final reduction → counters reset</text><text x="88" y="1027" font-size="15" font-weight="400">PART2: 같은 launch에서 완료 · PART1: standalone reducer fallback</text><path d="M600 1060V1090" class="edge"/><rect x="35" y="1090" width="1130" height="80" rx="12" fill="#e9eff4" stroke="#a7bac6"/><text x="55" y="1121" font-size="19" font-weight="700">6개 출력: dg, dWg, dtri, dgamma, dbeta, dWp</text><text x="55" y="1150" font-size="16" font-weight="400">dg / dtri → 기존 Triton B5+ · 실험 경로; production 기본 dispatch는 미변경</text><rect x="35" y="1195" width="1130" height="222" rx="12" fill="#fff" stroke="#a7bac6"/><text x="55" y="1228" font-size="18" font-weight="700">Dropout25% · 3×200 CUDA-event samples · Triton/cuBLAS 기준</text><text x="55" y="1260" font-size="20" font-weight="700">L384: 300.00 → 172.64 µs (1.738×)     L768:1182.26 → 611.23 µs (1.934×)</text><text x="55" y="1293" font-size="16" font-weight="400">이번 개선: 이전 balanced 대비1.68% /1.83% · 전체 backward1.129× /1.146×</text><text x="55" y="1325" font-size="16" font-weight="400">252 registers /spill0 · 24 strict cases +saved-value replay8회 +sanitizer 통과</text><text x="55" y="1357" font-size="18" font-weight="700">Warm NCU DRAM74.14% /81.98% · SoL90% 도달로 판단하지 않음</text><text x="55" y="1388" font-size="15" font-weight="400">cuEquivariance의 전체 backward와 B1–B4 hybrid 비교는 HTML의 별도 표 참조</text></svg>