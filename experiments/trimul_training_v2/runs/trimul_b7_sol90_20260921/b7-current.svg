<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1150" viewBox="0 0 1660 1150"><rect width="1660" height="1150" fill="#f4f8fb"/><style>text{font-family:Arial, sans-serif;fill:#183546}.code{font-family:monospace;font-size:16px}.sub{fill:#506b7b}</style><text x="32" y="43" font-size="29" class="">B7–B12 · H100 학습 · 실제 HBM 입출력과 커널 내부 계산</text><text x="32" y="77" font-size="19" class="sub">L384 / L768 · C128 · 양방향 H256 · BF16 · dropout 25% · B1 v51 및 forward 저장 정책 유지</text><text x="32" y="106" font-size="18" class="">개선 후보: dW 두 행 타일 중첩 + dX 전용 TMA producer + 두 커널 모두 2 CTA/SM</text><text x="32" y="139" font-size="16" class="sub">HBM payload는 논리적 버퍼 크기다. 재읽기는 L2에서 처리될 수 있으며 실측 DRAM 전송량과 다르다.</text><text x="32" y="176" font-size="21" class="">CUDA ① dW · 256 CTA · 128 producer + 128 consumer · 2 CTA/SM · shared 112 KiB</text><rect x="32" y="196" width="300" height="330" rx="10" fill="#e6f2fc" stroke="#bed0db"/><rect x="355" y="196" width="910" height="330" rx="10" fill="#e3f4ed" stroke="#bed0db"/><rect x="1288" y="196" width="340" height="330" rx="10" fill="#fff0df" stroke="#bed0db"/><path d="M332 336 H355 M1265 336 H1288" stroke="#527485" stroke-width="3"/><path d="M670 210 V511" stroke="#83b29a"/><text x="48" y="227" font-size="17" class="">HBM → TMA / register</text><text x="48" y="256" font-size="17" class="">x_n: [M,128] BF16</text><text x="48" y="285" font-size="17" class="">W1: [1024,128] BF16</text><text x="48" y="314" font-size="17" class="">dLeft / dRight: [256,M] ×2</text><text x="48" y="343" font-size="17" class="">pair mask: [M] BF16</text><text x="370" y="227" font-size="17" class="">네 단계 TMA 입력 버퍼</text><text x="370" y="256" font-size="17" class="">x_n은 이미 정규화됨</text><text x="370" y="285" font-size="17" class="">projection/gate 재계산</text><text x="370" y="314" font-size="17" class="">GP(row1) ↔ GLU(row0) 중첩</text><text x="370" y="343" font-size="17" class="">두 행 K128 dW → FP32 누적</text><text x="370" y="372" font-size="17" class="">CTA partial → 전체 합산</text><text x="370" y="401" font-size="17" class="">중복 x_n shared 재저장 제거</text><text x="686" y="227" font-size="17" class="code"># Each side and hidden-channel tile</text><text x="686" y="255" font-size="17" class="code">p = xn @ Wp</text><text x="686" y="283" font-size="17" class="code">s = sigmoid(xn @ Wg)</text><text x="686" y="311" font-size="17" class="code">d = bf16(dSide * mask)</text><text x="686" y="339" font-size="17" class="code">dp = bf16(d * s)</text><text x="686" y="367" font-size="17" class="code">dg = bf16(d * p * s * (1-s))</text><text x="686" y="395" font-size="17" class="code">partial_dWp += xn.T @ dp</text><text x="686" y="423" font-size="17" class="code">partial_dWg += xn.T @ dg</text><text x="686" y="451" font-size="17" class="code">dW = bf16(sum(partials))</text><text x="1305" y="227" font-size="17" class="">HBM outputs</text><text x="1305" y="256" font-size="17" class="">dWL / dWLg / dWR / dWRg</text><text x="1305" y="285" font-size="17" class="">4 × [128,256] BF16</text><text x="1305" y="314" font-size="17" class="">합계 262.14 kB</text><text x="1305" y="343" font-size="17" class="">scratch: FP32 partial dW</text><text x="1305" y="372" font-size="17" class="">16.78 MB write + read</text><text x="1305" y="401" font-size="17" class="">dConcat HBM 저장 없음</text><text x="32" y="572" font-size="21" class="">CUDA ② dX + LN 미분 + residual · 264 CTA · 128 producer + 128 consumer · 2 CTA/SM · shared 112 KiB</text><rect x="32" y="592" width="300" height="330" rx="10" fill="#e6f2fc" stroke="#bed0db"/><rect x="355" y="592" width="910" height="330" rx="10" fill="#e3f4ed" stroke="#bed0db"/><rect x="1288" y="592" width="340" height="330" rx="10" fill="#fff0df" stroke="#bed0db"/><path d="M332 732 H355 M1265 732 H1288" stroke="#527485" stroke-width="3"/><path d="M670 606 V907" stroke="#83b29a"/><text x="48" y="623" font-size="17" class="">HBM → TMA / register</text><text x="48" y="652" font-size="17" class="">x_n, raw x: [M,128] ×2</text><text x="48" y="681" font-size="17" class="">dLeft / dRight: [256,M] ×2</text><text x="48" y="710" font-size="17" class="">dGate, dy: [M,128] ×2</text><text x="48" y="739" font-size="17" class="">WT 4개, Wgate, gamma_in</text><text x="48" y="768" font-size="17" class="">pair mask: [M] BF16</text><text x="370" y="623" font-size="17" class="">전용 producer: TMA 데이터 공급</text><text x="370" y="652" font-size="17" class="">mask는 한 번 읽고 재사용</text><text x="370" y="681" font-size="17" class="">projection/gate 재계산</text><text x="370" y="710" font-size="17" class="">L768: 다음 행 x_n·첫 G 선행 읽기</text><text x="370" y="739" font-size="17" class="">raw x → mean / rstd 계산</text><text x="370" y="768" font-size="17" class="">raw fragment 레지스터 유지</text><text x="370" y="797" font-size="17" class="">LN 미분 + dy residual</text><text x="686" y="623" font-size="17" class="code">dp, dg = same_GLU_bwd(xn, dSide)</text><text x="686" y="651" font-size="17" class="code">dxn = sum(dp @ Wp.T + dg @ Wg.T)</text><text x="686" y="679" font-size="17" class="code">dxn = bf16(dxn + bf16(dGate @ Wgate.T))</text><text x="686" y="707" font-size="17" class="code">mu, rs = stats(raw_x)</text><text x="686" y="735" font-size="17" class="code">xhat = (raw_x - mu) * rs</text><text x="686" y="763" font-size="17" class="code">dx, dgamma, dbeta = ln_bwd(dxn, xhat, rs)</text><text x="686" y="791" font-size="17" class="code">dx = bf16(bf16(dx) + dy)</text><text x="686" y="819" font-size="17" class="code">param_grad = sum(CTA_partials)</text><text x="1305" y="623" font-size="17" class="">HBM outputs</text><text x="1305" y="652" font-size="17" class="">dx: [M,128] BF16</text><text x="1305" y="681" font-size="17" class="">L384: 37.75 MB</text><text x="1305" y="710" font-size="17" class="">L768: 150.99 MB</text><text x="1305" y="739" font-size="17" class="">dgamma_in, dbeta_in: 1.02 kB</text><text x="1305" y="768" font-size="17" class="">LN scratch: 270.34 kB</text><text x="1305" y="797" font-size="17" class="">dxn HBM 저장 없음</text><text x="32" y="975" font-size="21" class="">동일 GPU 교대 CUDA-event 측정 · 두 CUDA launch를 합친 B7–B12 구간</text><text x="32" y="1011" font-size="22" class="">L384: 544.928 → 395.584 μs  (1.378×)        L768: 2154.080 → 1486.816 μs  (1.449×)</text><text x="32" y="1049" font-size="18" class="">전체 FWD+BWD: 1200.352 → 1048.768 μs / 4980.608 → 4265.904 μs. 구간별 측정값을 합산하지 않는다.</text><text x="32" y="1087" font-size="17" class="sub">SoL90 미달. 수식은 의미 설명용 PyTorch 의사코드이며 BF16 반올림·실행 순서의 완전한 명세가 아니다.</text><text x="32" y="1121" font-size="17" class="sub">실제 검증·기준 오차·NCU 해석은 함께 제공하는 보고서 참조. B1, cuBLAS triangle matmul, 저장 정책은 이번 변경 대상 밖.</text></svg>