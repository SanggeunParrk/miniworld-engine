<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1210" viewBox="0 0 1440 1210" role="img" aria-labelledby="title desc">
<title id="title">TriMul 내부 재계산 배선: projection dW의 gate 절반만 계산</title>
<desc id="desc">Forward Anthropic no-save K1, cuBLAS 두 번, no-save K3. B1-B4 한 CUDA 호출에서 dWgate 36 CTA, dWproj 48 CTA, dtri 48 CTA. dWproj 안에서 WG0 입력 LN 및 필요한 gate 64채널과 WG1 출력 LN을 병렬 수행한다. B5-B6 cuBLAS 네 번, B7-B12는 이전 최적화 커널 유지.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#537184"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;fill:#143447}.h{font-size:22px;font-weight:700}.t{font-size:17px}.s{font-size:15px;fill:#466475}.small{font-size:13px;fill:#466475}.cuda{fill:#f3efff;stroke:#9675c3;stroke-width:2;rx:12}.box{fill:#fff;stroke:#a1b6c4;stroke-width:1.5;rx:10}.new{fill:#e9f9f0;stroke:#398b68;stroke-width:2;rx:10}.lib{fill:#edf1f5;stroke:#91a4b3;stroke-width:2;rx:12}.line{fill:none;stroke:#537184;stroke-width:2;marker-end:url(#a)}</style>
<rect width="1440" height="1210" fill="#f7fafc" rx="16"/>
<text x="30" y="42" class="h">TriMul · inference forward + backward 내부 재계산</text>
<text x="30" y="70" class="s">H100 node02 · L384 / 768 · BF16 C128 · 양방향 · dropout25% · mask / residual · 2026-09-21</text>
<text x="30" y="108" class="h">FORWARD · Anthropic 파생 native CUDA · 이전 재계산 버전과 동일</text>
<rect x="30" y="127" width="470" height="115" class="cuda"/><text x="47" y="155" class="h">K1 · input LN + projection / gate</text><text x="47" y="185" class="t">→ GLU → mask → left / right</text><text x="47" y="214" class="s">x_n / p / gate / LN 통계 저장 없음</text>
<path d="M501 185H530" class="line"/><rect x="538" y="127" width="255" height="115" class="lib"/><text x="555" y="156" class="h">cuBLAS × 2</text><text x="555" y="187" class="t">양방향 contraction</text><text x="555" y="215" class="s">→ tri</text>
<path d="M795 185H823" class="line"/><rect x="831" y="127" width="579" height="115" class="cuda"/><text x="848" y="155" class="h">K3 · output LN + projection × output gate</text><text x="848" y="185" class="t">→ dropout → residual → y</text><text x="848" y="214" class="s">xn_out / projection / gate / LN 통계 저장 없음</text>
<rect x="30" y="259" width="1380" height="61" class="new"/><text x="48" y="284" class="t">Forward 중간값 유지: left / right / tri · L384 226.5 MB / L768 906.0 MB</text><text x="48" y="307" class="small">입력·가중치·mask·dropout·packed weight 참조는 별도. 논리적 tensor-size 합계이며 peak GPU memory 실측이 아님.</text>
<text x="30" y="360" class="h">BACKWARD · 재계산 activation을 HBM에 복원하지 않음</text>
<rect x="30" y="380" width="662" height="690" class="cuda"/><text x="48" y="414" class="h">B1–B4 · b1_fused · 한 번 호출</text><text x="48" y="443" class="s">132 CTA · 256 threads / CTA · row64 · shared227840 B</text>
<rect x="48" y="461" width="626" height="61" class="box"/><text x="63" y="487" class="t">TMA 이중 버퍼: 다음 raw x / tri 읽기 ║ 현재 타일 계산</text><text x="63" y="510" class="small">48 KiB × 2 행 버퍼 · Wgate / Wproj shared 상주</text>
<rect x="48" y="539" width="626" height="94" class="box"/><text x="64" y="565" class="t">36 CTA · dWgate 역할 · 기존 계산 유지</text><text x="64" y="592" class="s">input LN + output LN → gate / projection 재계산</text><text x="64" y="616" class="s">dropout · gate 미분 → dg TMA 출력 + dWgate WGMMA</text>
<rect x="48" y="650" width="626" height="244" class="new"/><text x="64" y="679" class="t">48 CTA · dWproj 역할 · 이번 변경</text>
<rect x="64" y="695" width="327" height="119" class="box"/><text x="78" y="722" class="t">WG0 · 128 threads</text><text x="78" y="749" class="s">input LN → 필요한 gate64만</text><text x="78" y="776" class="s">dy × dropout × gate → dP64</text><text x="78" y="800" class="small">사용하지 않는 gate64 GEMM 제거</text>
<rect x="406" y="695" width="250" height="119" class="box"/><text x="420" y="722" class="t">WG1 · 128 threads</text><text x="420" y="749" class="s">output LN256 계산</text><text x="420" y="777" class="s">tri → normalized tri</text><text x="420" y="800" class="small">WG0 계산과 동시에 실행</text>
<path d="M224 816V838H347" class="line"/><path d="M531 816V838H375" class="line"/><text x="65" y="877" class="t">CTA 동기화 → 두 WG가 dWproj WGMMA 계산</text>
<rect x="48" y="911" width="626" height="94" class="box"/><text x="64" y="937" class="t">48 CTA · dtri 역할 · 기존 계산 유지</text><text x="64" y="965" class="s">LN / gate 재계산 → dP × Wproj → output LN 미분</text><text x="64" y="988" class="s">→ dtri · dγ_out / dβ_out partial</text>
<text x="50" y="1036" class="s">dW / LN parameter partial reduction까지 같은 CUDA 호출</text><text x="50" y="1060" class="small">기존 CTA 배분36 / 52 / 44 → 36 / 48 / 48 · 계산식·BF16 반올림 유지</text>
<path d="M695 721H719" class="line"/><rect x="728" y="380" width="200" height="690" class="lib"/><text x="745" y="414" class="h">B5–B6</text><text x="745" y="447" class="t">cuBLAS × 4</text><text x="745" y="526" class="s">dtri + left / right</text><text x="745" y="557" class="s">→ dleft / dright</text><text x="745" y="651" class="s">기존 구현 유지</text><text x="745" y="681" class="small">Forward contraction</text><text x="745" y="705" class="small">재계산 없음</text>
<path d="M931 721H955" class="line"/><rect x="964" y="380" width="446" height="690" class="cuda"/><text x="981" y="414" class="h">B7–B12 · front_b7b12</text><text x="981" y="443" class="s">기존 선택 유지 · 한 번 호출</text>
<rect x="981" y="466" width="412" height="181" class="box"/><text x="998" y="496" class="t">dW64 CTA</text><text x="998" y="525" class="s">TMA producer1 + consumer2</text><text x="998" y="554" class="s">input LN → packed gate / projection</text><text x="998" y="583" class="s">→ GLU 미분 → dW WGMMA</text><text x="998" y="623" class="small">다음 행 전송과 현재 계산 중첩</text>
<rect x="981" y="667" width="412" height="190" class="box"/><text x="998" y="697" class="t">dX68 CTA</text><text x="998" y="727" class="s">방향별 packed weights128 KiB 상주</text><text x="998" y="757" class="s">gate / projection 미분 → input LN 미분</text><text x="998" y="787" class="s">→ residual → dx</text><text x="998" y="832" class="small">dW / LN parameter reduction 포함</text>
<text x="984" y="908" class="t">이번 후보 미채택</text><text x="984" y="937" class="s">consumer3: register spill 발생</text><text x="984" y="967" class="s">shared-input 재계산: 더 느림</text><text x="984" y="997" class="s">LN 통계 재사용: 1% 미만 차이</text>
<rect x="30" y="1090" width="1380" height="91" class="box"/><text x="48" y="1120" class="t">gradient 전달 텐서(dg / dtri / dleft / dright / dx)와 dW reduction partial의 global 메모리는 여전히 필요함.</text><text x="48" y="1150" class="s">Anthropic Apache-2.0 native v5 TMA / WGMMA / LN / layout을 계승한 학습 확장. Production 기본값 유지 · 1.7배 미달 / SoL90 미입증.</text>
</svg>
