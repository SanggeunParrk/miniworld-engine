<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1050" viewBox="0 0 1360 1050" role="img" aria-labelledby="title desc">
<title id="title">TriMul on-chip 재계산 · 최적화 후 실제 배선</title>
<desc id="desc">Anthropic 파생 inference forward는 left, right, tri만 유지한다. B1-B4는 double-buffered TMA와 resident weights, B7-B12는 TMA producer 및 dX 가중치 재사용으로 구성된 단일 CUDA 커널이다. contraction은 cuBLAS를 유지한다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#6a8291"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;fill:#163548} .title{font-size:27px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:16px}.s{font-size:14px;fill:#4e6875}.small{font-size:13px;fill:#4e6875}.box{fill:#fff;stroke:#a4b9c6;stroke-width:2;rx:13}.cuda{fill:#f5f0ff;stroke:#9b83c3;stroke-width:2;rx:13}.mem{fill:#e9f8f1;stroke:#54a489;stroke-width:2;rx:10}.lib{fill:#f0f3f5;stroke:#9cacb7;stroke-width:2;rx:13}.line{fill:none;stroke:#6a8291;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style>
<rect width="1360" height="1050" rx="15" fill="#f7fafc"/>
<text x="32" y="45" class="title">TriMul · inference forward + on-chip backward 재계산</text>
<text x="32" y="74" class="s">H100 / L384·768 / BF16 C128 / 양방향 / dropout25% / mask·residual 포함 · 2026-09-21</text>
<text x="32" y="115" class="h">FORWARD · 같은 Anthropic 파생 K1 / K3 · 학습 activation 저장 없음</text>
<rect x="32" y="132" width="410" height="124" class="cuda"/>
<text x="50" y="160" class="h">K1 · native CUDA</text><text x="50" y="187" class="t">input LN → projection + gate → GLU · mask</text><text x="50" y="215" class="s">x_n · preactivation · LN 통계 저장 안 함</text><text x="50" y="240" class="s">출력: left / right (양방향)</text>
<path d="M445 192H480" class="line"/>
<rect x="486" y="132" width="284" height="124" class="lib"/><text x="505" y="162" class="h">cuBLAS · 2회</text><text x="505" y="195" class="t">outgoing / incoming</text><text x="505" y="231" class="s">출력: tri</text>
<path d="M773 192H808" class="line"/>
<rect x="814" y="132" width="514" height="124" class="cuda"/><text x="833" y="160" class="h">K3 · native CUDA</text><text x="833" y="187" class="t">output LN → projection × output gate</text><text x="833" y="214" class="t">→ dropout → residual → y</text><text x="833" y="240" class="s">xn_out · projection · gate · LN 통계 저장 안 함</text>
<rect x="32" y="278" width="1296" height="57" class="mem"/><text x="50" y="302" class="h">Forward에서 유지: left / right / tri</text><text x="50" y="325" class="small">입력·가중치·mask·dropout 참조 / packed weights는 별도 유지. 중간값 226.5 MB (L384) / 906.0 MB (L768). Peak memory 아님.</text>
<path d="M233 257V276" class="line dash"/><path d="M629 257V276" class="line dash"/>
<text x="32" y="378" class="h">BACKWARD · 영역별 단일 cooperative CUDA 호출 · 재계산 activation은 register / shared에만 존재</text>
<rect x="32" y="399" width="432" height="470" class="cuda"/>
<text x="50" y="430" class="h">B1–B4 · b1_fused</text><text x="50" y="458" class="s">132 CTA · 256 threads · row tile64</text>
<rect x="51" y="476" width="394" height="74" class="box"/><text x="66" y="501" class="t">TMA buffer A ↔ B · 각각48 KiB</text><text x="66" y="530" class="s">다음 x / tri 읽기 ║ 현재 LN / GEMM</text>
<path d="M249 553V574" class="line"/>
<rect x="51" y="580" width="394" height="105" class="box"/><text x="66" y="607" class="t">input LN → output gate 재계산</text><text x="66" y="635" class="t">output LN → 필요한 projection 재계산</text><text x="66" y="662" class="s">Wgate / Wproj: shared에 상주</text>
<path d="M249 688V710" class="line"/>
<rect x="51" y="717" width="394" height="126" class="box"/><text x="66" y="744" class="t">dropout · gate 미분 → WGMMA dW / dtri</text><text x="66" y="772" class="t">output LN 미분 · dg는 TMA 출력</text><text x="66" y="801" class="s">dWgate36 / dWproj52 / dX44 CTA</text><text x="66" y="825" class="small">partial reduction까지 같은 커널</text>
<path d="M468 620H496" class="line"/>
<rect x="503" y="399" width="215" height="470" class="lib"/><text x="523" y="430" class="h">B5–B6 · cuBLAS</text><text x="523" y="464" class="t">4회 그대로</text><text x="523" y="523" class="t">입력: dtri</text><text x="523" y="554" class="s">저장된 left / right</text><text x="523" y="587" class="s">contraction 미분</text><text x="523" y="644" class="t">출력: dleft / dright</text><text x="523" y="725" class="s">Forward contraction</text><text x="523" y="751" class="s">재실행 없음</text>
<path d="M722 620H750" class="line"/>
<rect x="756" y="399" width="572" height="470" class="cuda"/><text x="775" y="430" class="h">B7–B12 · front_b7b12</text><text x="775" y="458" class="s">132 CTA · 384 threads · row64 / DW hidden32</text>
<rect x="775" y="476" width="534" height="139" class="box"/><text x="790" y="503" class="t">dW64 CTA: producer1 → consumer2</text><text x="790" y="532" class="s">TMA: 다음 raw x / dy ║ 각 consumer 계산</text><text x="790" y="560" class="t">input LN → packed gate / projection</text><text x="790" y="588" class="t">→ GLU 미분 → dW WGMMA</text>
<rect x="775" y="633" width="534" height="162" class="box"/><text x="790" y="662" class="t">dX68 CTA: packed weights128 KiB 재사용</text><text x="790" y="691" class="s">한 방향의 가중치 → shared에 유지</text><text x="790" y="719" class="t">gate 미분 GEMM → projection 미분 GEMM</text><text x="790" y="747" class="t">→ input LN 미분 → residual → dx</text><text x="790" y="776" class="small">gate / projection의 FP32 누적 순서 보존</text>
<text x="777" y="830" class="s">dW · LN parameter reduction까지 같은 커널</text><text x="777" y="853" class="small">재계산한 x_n / p / gate의 HBM write 없음</text>
<rect x="32" y="890" width="1296" height="125" class="box"/><text x="50" y="922" class="h">여전히 필요한 global 데이터</text><text x="50" y="952" class="t">dg / dtri / dleft / dright / dx + dW reduction partial. 커널 사이 gradient 전달과 reduction scratch는 유지한다.</text><text x="50" y="981" class="s">Anthropic native v5의 TMA·WGMMA·LN·layout을 계승한 학습 확장. 전체 학습1.22× (직전 재계산 대비), 저장형보다 아직25–26% 느림.</text>
</svg>
