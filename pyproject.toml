[project]
name = "miniworld-engine"
version = "2.5.0"
requires-python = ">=3.10"
readme = "README.md"
description = "H100 CUDA / Triton kernels for AlphaFold3-style modules, with a PyTorch reference backend per module, accuracy and speed measurers, and a version-based judge."
license = "MIT AND Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "licenses/THIRD_PARTY_NOTICES.md", "licenses/Anthropic-Apache-2.0.txt", "licenses/Anthropic-NOTICE",
                 "licenses/CUTLASS-LICENSE.txt", "licenses/FlashAttention-LICENSE.txt"]
# The runtime: what `miniworld_engine.modules` and `miniworld_engine.kernels` import. Measurement (measure/, judge/) adds pyyaml only.
dependencies = [
  "torch>=2.8",
  "triton>=3.3",
  "einops",
  "jaxtyping",
  "numpy",
  "scipy",          # modules/primitives.py: truncated-normal parameter init
  "pydantic",       # modules/atom_dit.py: SWA atom block configs
  "pyyaml",         # measure/config.py: measurement configs
  "cuda-bindings",  # kernels/trimul_inproj/cuda: the H100 TriMul driver API
  "ninja",          # torch.utils.cpp_extension: every JIT build of a CUDA kernel (A100, or a Python / torch without prebuilt kernels)
  # The prebuilt H100 kernels (CUDA 12.9 / torch 2.13 / CPython 3.12), installed into miniworld_engine/_prebuilt/; elsewhere a kernel
  # JIT-builds on first use (needs a CUDA toolkit; the CUTLASS / MathDx headers are fetched by kernels/_headers.py, see docs/install.md).
  'miniworld-engine-kernels-sm90-cu129==2.5.0; sys_platform == "linux" and platform_machine == "x86_64" and python_version == "3.12"',
]

[project.optional-dependencies]
# External baselines (backends "cueq" / "anthropic" connect to them; never required by the engine's own backends).
#   transformers: the fork Anthropic's esmfold2 kit pins (its ef2_msa / ef2_w4 levers import transformers.models.esmfold2).
baselines = [
  "cuequivariance-torch>=0.12,<0.13",
  "transformers @ git+https://github.com/huggingface/transformers.git@ef32577f55da19a4989cd7b22e004dc43a4998cb",
]
# FlashAttention-4 (CuTe DSL, sm90+): the global-attention path of the SWA atom transformer's cuda backend. Prerelease wheel:
#   uv pip install --prerelease=allow "flash-attn-4[cu13]"
flash = ["flash-attn-4"]
dev = ["ruff==0.16.9", "pyright", "matplotlib"]   # matplotlib: measure/plot.py (benchmarks/)

[build-system]
requires = ["setuptools>=77"]  # >=77 for PEP 639 (SPDX `license` + `license-files`)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
# kernel families are namespace packages (no __init__.py); the generator script of swa_dit's wgmma_bf16.inc is build-time only
namespaces = true
exclude = ["*.swa_dit.cuda.gen"]

[tool.setuptools.package-data]
# Non-Python files the runtime reads in a wheel install:
#   **/*.cu / *.cuh / *.cpp / *.h / *.inc   CUDA sources the prebuilder compiles (and a JIT build falls back to)
#   **/configs/*.json                       launch-config tables per GPU and candidate lists (kernels/<family>/configs/)
#   requirements/*.csv                      the requirement lists the measurers, the judge and the prebuild plan read
#   measure/configs/*.yaml                  the canonical measurement configs
# Not shipped: judge/tokens/ and judge/answers.jsonl (the judge's measurement state, kept in the repository, not runtime).
miniworld_engine = ["**/*.cu", "**/*.cuh", "**/*.cpp", "**/*.h", "**/*.inc", "**/*.json", "**/*.csv", "**/*.yaml"]
[tool.setuptools.exclude-package-data]
miniworld_engine = ["judge/tokens/**", "judge/answers.jsonl"]

# ----------------------------------------------------------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
# Correctness and modernity, one import style, one string style. What is off and why: ANN (kernel code is unannotated where
# triton hands back Unknown; pyright is the type gate), D (docstrings are prose), N (math notation: L, D, Q, K, V, Wp),
# S / PL / SLF / ARG / T20 (subprocess builds, lazy imports that avoid triton compilation at import, reaching into triton
# internals on purpose, uniform launcher signatures, CLI prints), TC (jaxtyping resolves annotations at runtime).
select = [
  "E", "F", "W", "I", "UP", "B",
  "C4", "PIE", "RET", "SIM", "PERF", "FURB",
  "TID", "ICN", "FA",
  "Q", "ISC",
  "LOG", "G",
  "SLOT", "INT", "FLY", "NPY", "DTZ", "EXE", "YTT", "ASYNC",
  "RUF",
]
ignore = [
  "E501",    # line length is the formatter's target, not a hard wrap for tables and prose
  "E701", "E702",
  "E402",
  "E731",    # one-line kernel adapters
  "E741",    # `l`, `L`, `I` are dimensions
  "F722",    # jaxtyping shape strings
  "COM812",
  "RUF002", "RUF003",   # full-width characters in Korean comments
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Kernel bodies are faithful copies (team-gm branches, FlashAttentionBias, Anthropic kits): not linted, as the originals are not.
"src/miniworld_engine/kernels/**/triton/*.py" = ["ALL"]
"src/miniworld_engine/kernels/**/cuda/*.py" = ["ALL"]
"src/miniworld_engine/kernels/**/cuda/gen/*.py" = ["ALL"]

[tool.ruff.format]
docstring-code-format = false

# ---------------------------------------------------------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
# tests/cpu run anywhere (no GPU); tests/gpu need a CUDA device and skip cleanly without one (or without the card a marker names).
#   CPU:  pytest -m "not gpu"        GPU (one H100 job):  pytest tests/gpu -m gpu
testpaths = ["tests"]
pythonpath = ["src"]             # the checkout under test, ahead of any installed miniworld-engine
addopts = "-ra --strict-markers --import-mode=importlib -p no:cacheprovider"
markers = [
  "gpu: needs a CUDA device (skipped without one)",
  "h100: needs an H100 (sm_90); skipped on other cards",
  "a100: needs an A100 (sm_80); skipped on other cards",
  "slow: takes more than a few seconds (deselect with -m \"not slow\")",
]

# --------------------------------------------------------------------------------------------------------------------------- pyright
[tool.pyright]
# The type gate (tools/check.sh): basic mode over the package and the tests; the vendored kernel bodies ruff leaves alone are out.
include = ["src", "tests"]
exclude = [
  ".pixi", "**/.pixi", "**/__pycache__",
  # the same vendored kernel bodies ruff leaves alone
  "src/miniworld_engine/kernels/**/triton/**",
  "src/miniworld_engine/kernels/**/cuda/**",
]
pythonVersion = "3.10"
typeCheckingMode = "basic"

# ----------------------------------------------------------------------------------------------------------------------------- pixi
# One environment for the repo (torch 2.13 cu129 + triton 3.7, cuequivariance baseline, TE). The materialized `.pixi/` is ignored.
# Pinned to CUDA 12.9 (driver >= 575): cu12 only; on a cluster whose compute nodes are offline, resolve / download on the login node;
# at runtime export LD_LIBRARY_PATH=$CONDA_PREFIX/lib.
[tool.pixi.workspace]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
pip = "*"
cuda-toolkit = "12.9.*"
cudnn = "*"
nccl = "*"
cuda-nvtx-dev = "12.9.*"
ninja = "*"
cmake = "*"
setuptools = "*"
wheel = "*"
pybind11 = "*"

[tool.pixi.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu129"]
no-build-isolation = ["transformer-engine-torch"]

[tool.pixi.pypi-dependencies]
miniworld-engine = { path = ".", editable = true, extras = ["baselines", "dev"] }
torch = { version = "==2.13.0", index = "https://download.pytorch.org/whl/cu129" }
transformer-engine = { version = "==2.19.*", extras = ["pytorch", "core-cu12"] }
transformer-engine-cu12 = "==2.19.*"
cuequivariance-ops-torch-cu12 = "==0.12.*"

[tool.pixi.activation.env]
PYTHONNOUSERSITE = "1"
CUDA_HOME = "$CONDA_PREFIX"

[tool.pixi.tasks]
# transformer-engine-torch's sdist declares the cu13 core; reinstall the cu12 one last. Run after every `pixi install`.
fix-te-cu12 = "pip install --no-deps --force-reinstall transformer_engine_cu12==2.19.0"
lint = "ruff check src tools tests"
format = "ruff format src"
types = "pyright"
# the gate (tools/check.sh: ruff, pyright, CPU tests) and the GPU tests; on the cluster inside a Slurm job, never on the login node
check = "tools/check.sh"
test = "pytest tests/cpu -m 'not gpu'"
test-gpu = "pytest tests/gpu -m gpu"
# Everything below needs Slurm (never the login node): prebuild on a CPU node, pretune / measure on an H100.
prebuild = "python -m miniworld_engine.kernels._prebuild"
pretune = "python -m miniworld_engine.kernels._pretune"
judge = "python -m miniworld_engine.judge"
