[workspace]
channels = ["conda-forge", "nvidia"]
name = "te-env"
platforms = ["linux-64"]
version = "0.1.0"
description = "Dedicated env for the NVIDIA Transformer Engine LayerNormLinear baseline vs torch.compile."

[dependencies]
python = "3.12.*"
pip = "*"
# Build toolchain for compiling Transformer Engine from source (needs nvcc + cudnn).
# Match node01 driver (575.x / CUDA 12.9-capable) — keep toolkit at cu12.8 to align with torch cu128.
cuda-toolkit = "12.8.*"
cudnn = "*"
ninja = "*"
cmake = "*"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]

[pypi-dependencies]
# torch built for cu128 (CUDA 12.8) — compatible with the cluster's 575 driver.
torch = ">=2.8,<2.12"
# NVIDIA Transformer Engine with the PyTorch frontend (te.LayerNormLinear).
transformer-engine = { version = "*", extras = ["pytorch"] }
# Triton + light deps so we can also run the torch.compile baseline / our own
# kernels inside this same env when comparing.
triton = "*"
einops = "*"
jaxtyping = "*"
numpy = "*"
typing_extensions = "*"

[activation.env]
TE_ENV = "1"
# TE's build looks at CUDA_HOME for nvcc/headers; point it at the pixi prefix.
CUDA_HOME = "$CONDA_PREFIX"

[tasks]
te-smoke = "python -c 'import transformer_engine.pytorch as te; print(\"TE ok\", te.__version__ if hasattr(te,\"__version__\") else \"\")'"
gpu-smoke = "python -c 'import torch; print(torch.__version__, torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else None)'"
